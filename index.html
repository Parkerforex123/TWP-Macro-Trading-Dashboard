<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>try{var __t=localStorage.getItem('twp_theme_pref');if(__t==="white") __t="ash"; if(__t==="ash"||__t==="black"){document.documentElement.classList.add(__t);}}catch(e){}</script>
<title>TWP — Fundamentals Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23181b22%27/%3E%3Ctext x=%2732%27 y=%2742%27 text-anchor=%27middle%27 font-family=%27Arial,sans-serif%27 font-size=%2725%27 font-weight=%27700%27 fill=%27white%27%3ETWP%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f4f5f7; --panel3:#e9ebef; --border:#d7dae0;
  --text:#181b22; --text-dim:#565e6d; --text-faint:#8991a0;
  --bullish:#089981; --bullish-strong:#089981; --bearish:#f23645; --bearish-strong:#f23645;
  --bullish-lean:#78b995; --bearish-lean:#b87980;
  --bullish-mild:#067765; --bearish-mild:#bd2a36; --pill-neutral-bg:#e2e4e8;
  --neutral:#89919d; --amber:#c69a3a; --radius:8px;
}
body.ash, html.ash{
  --bg:#151817; --panel:#1c211f; --panel2:#232925; --panel3:#2a302c; --border:#343c37;
  --text:#e9ebf1; --text-dim:#8b93a8; --text-faint:#5c6478;
  --bullish:#089981; --bullish-strong:#089981; --bearish:#f23645; --bearish-strong:#f23645;
  --bullish-lean:#5d8d73; --bearish-lean:#8f5b62;
  --bullish-mild:#04493e; --bearish-mild:#741a21; --pill-neutral-bg:#242925;
  --neutral:#6f7772; --amber:#c85b16;
}
body.black, html.black{
  --bg:#080a08; --panel:#10130f; --panel2:#151815; --panel3:#1b1f19; --border:#2b322a;
  --text:#eef2ee; --text-dim:#aeb7b0; --text-faint:#707a74;
  --bullish:#089981; --bullish-strong:#089981; --bearish:#f23645; --bearish-strong:#f23645;
  --bullish-lean:#5d8d73; --bearish-lean:#8f5b62;
  --bullish-mild:#04493e; --bearish-mild:#741a21; --pill-neutral-bg:#1a1e18;
  --neutral:#6f7772; --amber:#c85b16;
}
body.ash, body.black, html.ash, html.black{ --dark:1; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100%;}
html{min-height:100vh;min-height:100dvh;}
body{min-height:100vh;min-height:100dvh;transition:background .15s;overscroll-behavior-y:none;}
.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-scroll table{min-width:560px;}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:600;}

.shell{display:flex;min-height:100vh;}
.rail{width:210px;flex:0 0 210px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:16px 12px;gap:14px;position:sticky;top:0;height:100vh;}
.brand{padding:2px 6px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.brand-mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:.4px;color:var(--bullish-strong);}
.theme-switch{display:flex;gap:3px;}
.theme-btn{background:#000;border:1px solid #000;color:#fff;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:11.5px;font-weight:700;}
.theme-btn:hover{color:var(--text);}
.theme-btn.active{background:#000;color:#fff;border-color:#000;}
.tabs{display:flex;flex-direction:column;gap:4px;}
.tab-btn{text-align:left;background:transparent;border:none;color:var(--text-dim);font-family:'Inter',sans-serif;
  font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer;border-left:3px solid transparent;}
.tab-btn:hover{background:var(--panel2);color:var(--text);}
.tab-btn.active{background:var(--panel3);color:var(--text);border-left:3px solid var(--amber);font-weight:700;}
.lock-box{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);transition:padding .15s,border-color .15s;}
.lock-box.collapsed{padding-top:0;border-top-color:transparent;}
.lock-box.collapsed .lock-state{justify-content:flex-end;margin-bottom:0;}
.lock-box.collapsed .lock-state-label{display:none;}
.lock-box.collapsed .lock-eye{width:18px;height:18px;font-size:12px;}
.lock-state{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;font-weight:700;}
.lock-state-label{display:flex;align-items:center;gap:6px;}
.lock-state.unlocked{color:var(--amber);}
.lock-box button.lock-eye{background:transparent;border:none;color:var(--text-dim);width:18px;height:18px;border-radius:0;padding:0;margin:0;cursor:pointer;font-size:12px;line-height:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.lock-eye:hover{color:var(--text);}
.lock-box.collapsed .lock-fields{display:none;}
.lock-box input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:7px 8px;border-radius:6px;font-size:15px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;
  -webkit-appearance:none;appearance:none;-webkit-text-fill-color:var(--text);}
.lock-box input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--panel2) inset;-webkit-text-fill-color:var(--text);caret-color:var(--text);}
.lock-box button{width:100%;background:var(--panel3);border:1px solid var(--border);color:var(--text);
  padding:7px 8px;border-radius:6px;font-size:11px;cursor:pointer;font-weight:700;}
.lock-box button:hover{border-color:var(--amber);}
.lock-box .hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;line-height:1.4;}
.lock-box .change-link{font-size:11.5px;color:var(--text-faint);cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block;}

.content{flex:1;padding:18px 22px 40px;max-width:1500px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.page-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin:0;}
.page-sub{color:var(--text-dim);font-size:11.5px;margin-top:3px;} .page-sub:empty{display:none;}
.updated{font-size:11.5px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
.tab-panel{display:none;} .tab-panel.active{display:block;}
.y2-grid{display:grid;grid-template-columns:1.1fr 1.9fr;gap:10px;}
.y2-input-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.y2-input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:7px;font-family:'IBM Plex Mono',monospace;width:100%;}
.y2-input:focus{outline:none;border-color:var(--amber);}
.y2-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.y2-btn{background:var(--panel3);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;}
.y2-btn.primary{background:var(--amber);border-color:var(--amber);color:#fff;}
.y2-btn:hover{filter:brightness(.97);}
.y2-note{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin-top:9px;}
.y2-score{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:17px;}
.y2-positive{color:var(--bullish-strong) !important;} .y2-negative{color:var(--bearish-strong) !important;} .y2-neutral{color:var(--text-dim) !important;}
.y2-partial{color:var(--amber);font-size:10.5px;font-weight:700;margin-top:3px;white-space:nowrap;}
.y2-comp{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11.5px;text-align:center;}
.y2-comp.pos{color:var(--bullish-strong);} .y2-comp.neg{color:var(--bearish-strong);} .y2-comp.neu{color:var(--text-dim);} .y2-comp.miss{color:var(--text-faint);}
.y2-score-table{min-width:1180px;}
.y2-component-note{font-size:11.5px;color:var(--text-faint);line-height:1.55;margin-top:10px;}
.y2-component-note b{color:var(--text-dim);}
.y2-spread{font-family:'IBM Plex Mono',monospace;font-weight:700;}
.y2-track{height:7px;background:var(--panel3);border-radius:4px;position:relative;min-width:130px;overflow:hidden;}
.y2-track i{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);left:50%;}
.y2-track b{position:absolute;top:0;bottom:0;background:var(--bullish);opacity:.8;}
.y2-track b.neg{background:var(--bearish);}
.y2-small{font-size:11.5px;color:var(--text-faint);}.y2-direction{font-size:12px;font-weight:700;}
.y2-chg-arrow{font-size:12px;font-weight:900;margin-right:1px;display:inline-block;vertical-align:middle;}
.y2-chg-arrow.up{color:var(--bullish-strong);} .y2-chg-arrow.down{color:var(--bearish-strong);} .y2-chg-arrow.flat{color:var(--text-faint);font-size:8px;}
@media(max-width:1000px){.y2-grid{grid-template-columns:1fr;}.y2-input-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:600px){.y2-input-grid{grid-template-columns:1fr;}}

.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.card h3{font-family:'Space Grotesk',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:0 0 14px;font-weight:700;}

.divergence{border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;font-size:12px;line-height:1.5;border:1px solid var(--border);}
.divergence.on{background:rgba(165,105,15,.08);border-color:rgba(165,105,15,.4);}
.divergence.off{color:var(--text-dim);}
.divergence b{color:var(--amber);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;white-space:nowrap;font-family:'Space Grotesk',sans-serif;font-size:12.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-dim);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;background:var(--panel2);}
td{padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text);font-weight:500;}
tr:last-child td{border-bottom:none;}
tr.rowhover:hover td{filter:brightness(.98);}
body.ash tr.rowhover:hover td, body.black tr.rowhover:hover td{filter:brightness(1.25);}
.ccy-name{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.5px;}
.legend-line{font-size:11.5px;color:var(--text-faint);margin-top:10px;line-height:1.5;}

.chip{display:inline-block;padding:5px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.3px;}
.chip-bull{background:rgba(53,185,106,.14);color:var(--bullish-strong);}
.chip-bull.strong{background:var(--bullish);color:#fff;}
.chip-bull.lean{background:rgba(53,185,106,.10);color:var(--text-dim);border:1px solid rgba(70,170,95,.32);}
.chip-bear{background:rgba(217,87,87,.13);color:var(--bearish-strong);}
.chip-bear.strong{background:var(--bearish);color:#fff;}
.chip-bear.lean{background:rgba(217,87,87,.10);color:var(--text-dim);border:1px solid rgba(224,69,63,.3);}
.chip-neu{background:rgba(139,147,163,.18);color:var(--text-dim);}
body.ash .chip-bull.strong, body.black .chip-bull.strong{background:rgba(129,199,132,.22);color:var(--bullish-strong);box-shadow:0 0 0 1px rgba(53,185,106,.4) inset;}
body.ash .chip-bear.strong, body.black .chip-bear.strong{background:rgba(217,83,95,.22);color:var(--bearish-strong);box-shadow:0 0 0 1px rgba(217,87,87,.4) inset;}
body.ash .chip-bull.lean, body.black .chip-bull.lean{background:rgba(53,185,106,.08);color:var(--text-dim);border-color:rgba(53,185,106,.3);}
body.ash .chip-bear.lean, body.black .chip-bear.lean{background:rgba(217,87,87,.08);color:var(--text-dim);border-color:rgba(217,87,87,.3);}

.cell-vstrong{background:var(--bullish);color:#fff;font-weight:700;}
.cell-strong{background:rgba(47,127,224,.28);color:var(--bullish-strong);font-weight:600;}
.cell-neutral{background:transparent;color:var(--text-dim);}
body.ash .cell-neutral, body.black .cell-neutral{background:rgba(255,255,255,.022);}
.cell-weak{background:rgba(217,83,95,.28);color:var(--bearish-strong);font-weight:600;}
.cell-vweak{background:var(--bearish);color:#fff;font-weight:700;}
body.ash .cell-vstrong, body.black .cell-vstrong{color:#06131f;}
body.ash .cell-vweak, body.black .cell-vweak{color:#2a060a;}

.raw-input{width:72px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 8px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
select.raw-input{width:104px;}
input:disabled, textarea:disabled{background:transparent;border-color:transparent;opacity:1;cursor:default;padding-left:0;-webkit-text-fill-color:inherit;}
select:disabled{background:transparent;border-color:transparent;color:var(--text);opacity:1;cursor:default;-webkit-appearance:none;appearance:none;}

.ccy-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.ccy-pill{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);padding:9px 18px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;cursor:pointer;letter-spacing:.5px;}
.ccy-pill:hover{color:var(--text);}
.ccy-pill.active{background:var(--panel3);color:var(--text);border-color:var(--amber);}

.detail-grid{display:grid;grid-template-columns:300px 1fr;gap:22px;}
@media(max-width:920px){.detail-grid{grid-template-columns:1fr;}}
.left-col .ccy-big{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;}
.left-col .ccy-full{color:var(--text-dim);font-size:15px;}
.gauge-svg{width:100%;height:auto;display:block;}
.gauge-num{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:700;text-align:center;margin-top:-50px;}
.stat-block{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-dim);}
.stat-chip{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;padding:3px 10px;border-radius:6px;}
.rate-box{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.rate-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rate-line input, .rate-line select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px;font-family:'IBM Plex Mono',monospace;font-weight:600;}
.move-select.HIKE{color:var(--bullish-strong);background:rgba(47,127,224,.12);border-color:var(--bullish);}
.move-select.CUT{color:var(--bearish-strong);background:rgba(217,83,95,.12);border-color:var(--bearish);}
.move-select.HOLD{color:var(--text-dim);}
.conv-select.High{color:var(--amber);font-weight:700;}
.conv-select.Medium{color:var(--text-dim);}
.conv-select.Low{color:var(--text-faint);}
.guidance-box{width:100%;min-height:110px;background:var(--panel2);border:1px solid var(--amber);color:var(--amber);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:15px;line-height:1.5;resize:none;margin-top:8px;overflow-y:auto;}
.field-label{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);margin-top:12px;margin-bottom:4px;}

.info-grid{display:grid;grid-template-columns:repeat(4,minmax(135px,1fr));gap:6px 10px;margin-bottom:8px;padding:8px 10px;background:var(--panel2);border-radius:8px;flex:1 1 auto;min-width:0;}
.info-trend-row{display:flex;gap:8px;align-items:stretch;}
.trend-panel{flex:1 1 0;min-width:360px;background:var(--panel2);border-radius:8px;padding:14px 16px;margin-bottom:18px;display:flex;flex-direction:column;justify-content:space-between;}
.trend-panel .k{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;}
.trend-panel .trend-score{font-size:20px;font-weight:700;margin-top:4px;}
.trend-panel .trend-delta{font-size:11px;margin-top:2px;}
.trend-panel svg{margin-top:10px;color:var(--text-dim);}
.info-item{display:flex;flex-direction:column;gap:4px;}
.info-item .k{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;}
.info-item .v{font-size:12px;font-weight:600;}
.info-item input{width:70px;background:var(--panel3);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;}
.info-item select{background:var(--panel3);border:1px solid var(--border);color:var(--text);padding:5px 7px;border-radius:6px;font-size:11px;}
.weight-col{display:none;width:0!important;padding:0!important;border:none!important;}
body.editing .weight-col{display:table-cell;width:auto!important;padding:5px 8px!important;border-bottom:1px solid var(--border)!important;}
.pair-flags{display:inline-flex;align-items:center;margin-right:8px;vertical-align:middle;}
.pair-flags .flag-a,.pair-flags .flag-b{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--panel3);border:1.5px solid var(--panel);overflow:hidden;}
.pair-flags .flag-b{margin-left:-8px;}
.pair-flags img{width:100%;height:100%;object-fit:cover;display:block;}
.pair-table td,.pair-table th{font-size:13.5px!important;}
.pair-table td,.pair-table th{padding-top:4px!important;padding-bottom:4px!important;padding-left:6px!important;padding-right:6px!important;}
.pair-table .mono,.pair-table .ccy-name,.pair-table .pair-bias-single,.pair-table .pair-bias-stack strong,.pair-table .pair-bias-stack .lean-word,.pair-table .pair-factor{font-size:13.5px!important;font-weight:800!important;}
.pair-table .trend-cell{min-height:26px!important;}
.pair-table .pair-bias-single,.pair-table .pair-bias-stack strong,.pair-table .pair-bias-stack .lean-word,.pair-table .pair-factor{font-family:'Space Grotesk',sans-serif!important;text-transform:uppercase!important;letter-spacing:.3px;}
.pair-table th:nth-child(10),.pair-table td:nth-child(10){text-align:center!important;}
/* 7D Δ column -- its own cell, sized to match the Score column font so it
   never reads as a second, smaller number crammed onto the pair name line. */
.pair-table .day-delta{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
.pair-table .day-delta-up{color:var(--bullish-strong)!important;}
.pair-table .day-delta-down{color:var(--bearish-strong)!important;}
.pair-table .day-delta-flat{color:var(--text-faint)!important;}
#tab-pairs .day-delta-cell{text-align:center;}

.pair-search-wrap{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:0 0 auto;}
.pair-search-wrap>div{display:flex;align-items:center;background:var(--panel2);border:1.5px solid var(--amber);border-radius:7px;padding:0 10px;transition:border-color .15s,box-shadow .15s;min-width:198px;}
.pair-search-wrap>div:focus-within{border-color:var(--amber);box-shadow:0 0 0 2px rgba(198,154,58,.22);}
.pair-search-icon{color:var(--text-faint);font-size:12px;margin-right:5px;line-height:1;flex:0 0 auto;}
.pair-search{background:transparent;border:none;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 0;width:100%;min-width:0;}
.pair-search::placeholder{color:var(--text-faint);letter-spacing:-.1px;}
.pair-search:focus{outline:none;}
.pair-search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;}
.pair-search-clear{display:none;background:transparent;border:none;color:var(--text-faint);font-size:16px;line-height:1;cursor:pointer;padding:4px 0 4px 8px;}
.pair-search-clear:hover{color:var(--amber);}
.pair-search-count{font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}

.sector-block{margin-bottom:10px;}
.sector-title{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.sector-title span.label{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);font-weight:700;}
.sector-block table{table-layout:fixed;}
.sector-block table th,.sector-block table td{vertical-align:middle;}
.sector-block table th:nth-child(1),.sector-block table td:nth-child(1){width:26%;text-align:left;}
.sector-block table th:nth-child(2),.sector-block table td:nth-child(2){width:9%;text-align:center;}
.sector-block table th:nth-child(3),.sector-block table td:nth-child(3){width:11%;text-align:left;}
.sector-block table th:nth-child(4),.sector-block table td:nth-child(4){width:11%;text-align:left;}

/* "Very Bullish/Bearish" got its own class (pair-bias-vbull/vbear) instead of reusing

<style id="scanner-styles">
/* Trade Scanner — a fully self-contained design. The table below carries only the
   .scanner-table class (not .pair-table), so none of the older Pair Ranking font-size/
   font-weight overrides bleed in here; every rule needed is defined in this block. */
.scanner-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:10px;}
.scanner-head-left{display:flex;flex-direction:column;gap:4px;}
.scanner-sub{color:var(--text-faint);font-weight:500;font-size:12.5px;}
.scanner-sorted{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;color:var(--text-faint);}
.scanner-head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.scanner-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);white-space:nowrap;}

/* The wrapper needs overflow-x:auto for the frozen left columns to work, but that
   quietly forces overflow-y to auto as well (that's just how the CSS overflow
   property works when only one axis is set) -- which makes THIS box the scrolling
   container instead of the page. A sticky header positioned against the page (e.g.
   top:56px) never sticks in that case, because from this box's own point of view it
   never scrolls. So instead we deliberately give it a real height and its own
   vertical scrollbar, and stick the header to the TOP OF THIS BOX (top:0) rather
   than to the page -- that's what actually keeps Side/Pair/Score/14D/Trend and the
   header labels on screen while scrolling through the row list. */
#tab-scanner .table-scroll{max-height:72vh;overflow-y:auto;overflow-x:auto;}
/* FIX: the block above traps the table in a fixed 72vh box with its own internal
   scrollbar so the sticky header has something to stick against. That's the same
   root cause that was already diagnosed and fixed for Pair Ranking (see the
   "pair-ranking-sticky" blocks further down this file): overflow-x:auto on this
   wrapper quietly forces overflow-y to auto too, which makes the WRAPPER itself the
   sticky containing block instead of the page -- so a plain top:0 sticky only sticks
   to the top of this small box. Boxing it in was one way to make that work, but it
   compresses how many rows are visible at once and leaves dead space on the page
   below the box instead of the table filling the page the way it used to.
   The real fix, same as Pair Ranking: stop this wrapper from being its own scroll
   container on desktop widths, so the header sticks to the PAGE and the table keeps
   its natural full height again. */
@media(min-width:1101px){
  #tab-scanner .table-scroll{
    max-height:none!important;
    overflow-x:clip!important;
    overflow-y:visible!important;
  }
}
#tab-scanner table.scanner-table{width:100%;border-collapse:collapse;}
#tab-scanner .scanner-table th{
  white-space:nowrap;text-align:center;font-family:'Inter',system-ui,sans-serif!important;
  font-size:11px!important;font-weight:700!important;letter-spacing:.3px;text-transform:uppercase;
  color:var(--text-faint)!important;background:var(--panel2);padding:8px 6px;border-bottom:1px solid var(--border);
  /* Header row stays on screen while scrolling down through the row list, so the
     column labels never disappear behind the data. Offset by the real page header
     height (same --twp-header-offset var Pair Ranking uses) instead of a bare top:0,
     so the sticky header parks just under the "Trade Scanner" title bar rather than
     the very top edge of the browser window. */
  position:sticky;top:var(--twp-header-offset,56px);z-index:5;
}
#tab-scanner .scanner-table th:nth-child(2),#tab-scanner .scanner-table th:nth-child(3){text-align:left;}
/* SCORE header called out in the deep/burnt-orange accent, same tone as the Score column values. */
#tab-scanner .scanner-table th:nth-child(4){color:var(--amber)!important;}
/* Agree / Carry / Led by: equal padding on both sides of each of these three columns
   so the visual gap before Carry matches the gap before Led by exactly. Led by's header
   is left-aligned to match its (left-aligned) body cells -- otherwise the header text
   floats centered in that column's wider auto-width and reads as a much bigger gap. */
#tab-scanner .scanner-table th:nth-child(14),#tab-scanner .scanner-table td:nth-child(14){padding-right:16px;}
#tab-scanner .scanner-table th:nth-child(15),#tab-scanner .scanner-table td:nth-child(15){padding-left:16px;padding-right:16px;}
#tab-scanner .scanner-table th:nth-child(16),#tab-scanner .scanner-table td:nth-child(16){padding-left:16px;}
#tab-scanner .scanner-table th:nth-child(16){text-align:left;}

}

/* Frozen columns: Side / Pair / Score / 14D stay on screen while scrolling right to

const SUPABASE_URL = "https://uxcluyadxdngcepwique.supabase.co";

async function supabaseRequest(path, options = {}) {
  const authToken = (options.useAuth && AUTH.accessToken) ? AUTH.accessToken : SUPABASE_KEY;
  const headers = Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + authToken,
    "Content-Type": "application/json",
    "Accept": "application/json"
  }, options.headers || {});
  const response = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({}, options, { headers }));
  if (!response.ok) {
    const text = await response.text();
    throw new Error("Supabase " + response.status + ": " + text);
  }
  if (response.status === 204) return null;
  return response.json();
}

// --- Real Supabase Auth (email + password checked server-side, not a client-side comparison) ---
var AUTH = { accessToken: null, refreshToken: null, expiresAt: null, email: null };
var authRefreshInFlight = null;

function loadAuthFromStorage(){
  try {
    var raw = localStorage.getItem('twp_auth_session_v1');
    if(!raw) return;
    var parsed = JSON.parse(raw);
    AUTH.accessToken = parsed.accessToken || null;
    AUTH.refreshToken = parsed.refreshToken || null;
    AUTH.expiresAt = parsed.expiresAt || null;
    AUTH.email = parsed.email || null;
  } catch(e) { console.error("Error reading auth session", e); }
}
function persistAuthToStorage(){
  try {
    if(AUTH.accessToken){
      localStorage.setItem('twp_auth_session_v1', JSON.stringify(AUTH));
    } else {
      localStorage.removeItem('twp_auth_session_v1');
    }
  } catch(e) { console.error("Error saving auth session", e); }
}

async function authSignIn(email, password){
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password })
  });
  const data = await res.json();
  if(!res.ok){
    throw new Error((data && (data.error_description || data.msg || data.error)) || "Sign in failed");
  }
  AUTH.accessToken = data.access_token;
  AUTH.refreshToken = data.refresh_token;
  AUTH.expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
  AUTH.email = email;
  persistAuthToStorage();
}

async function authRefresh(){
  if(!AUTH.refreshToken) return false;
  if(authRefreshInFlight) return authRefreshInFlight;
  authRefreshInFlight=(async function(){
    try {
      const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: AUTH.refreshToken })
      });
      const data = await res.json();
      if(!res.ok) throw new Error((data && (data.error_description || data.msg || data.error)) || "refresh failed");
      AUTH.accessToken = data.access_token;
      AUTH.refreshToken = data.refresh_token || AUTH.refreshToken;
      AUTH.expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
      persistAuthToStorage();
      return true;
    } catch(e) {
      console.error("Session refresh failed, signing out", e);
      authSignOut();
      return false;
    } finally {
      authRefreshInFlight=null;
    }
  })();
  return authRefreshInFlight;
}
function authSignOut(){
  AUTH.accessToken = null; AUTH.refreshToken = null; AUTH.expiresAt = null; AUTH.email = null;
  persistAuthToStorage();
}

// Keep the session alive: refresh a few minutes before expiry so an editing session
// doesn't silently die mid-update.
setInterval(function(){
  if(AUTH.accessToken && AUTH.expiresAt && (AUTH.expiresAt - Date.now() < 5*60*1000)){
    authRefresh();
  }
}, 60*1000);

// Merges today's LIVE value onto the end of a logged (days, vals) series so trend lines
// never look stale after an intra-day edit. If today's daily snapshot is already locked
// (Recalculate was hit earlier today), this overrides just the displayed last point with
// the live value -- it does NOT touch DAILY itself, so the locked history stays intact for
// tomorrow's 90-calendar-day trend baseline. If today has no logged entry yet, it appends one.
// Returns {days:[...], vals:[...], liveIdx:N} where liveIdx marks which point is live (not logged).
function withLiveToday(days, vals, liveVal, maxLen){
  var todayKey=new Date().toISOString().slice(0,10);
  var outDays=days.slice(), outVals=vals.slice(), liveIdx;
  if(outDays.length && outDays[outDays.length-1]===todayKey){
    outVals[outVals.length-1]=liveVal;
    liveIdx=outDays.length-1;
  } else {
    outDays.push(todayKey); outVals.push(liveVal);
    liveIdx=outDays.length-1;
    if(maxLen && outDays.length>maxLen){ outDays=outDays.slice(-maxLen); outVals=outVals.slice(-maxLen); liveIdx=outDays.length-1; }
  }
  return {days:outDays, vals:outVals, liveIdx:liveIdx};
}

function findEconomicCalendarIndicator(ccy,matcher){

    var arr=Array.isArray(DATA[ccy][sectors[si]])?DATA[ccy][sectors[si]]:[];
    for(var i=0;i<arr.length;i++) if(arr[i]&&matcher.test(String(arr[i].name||""))) return {sector:sectors[si],idx:i,ind:arr[i]};

function economicCalendarToday(){

function economicCalendarImpact(name){
  var n=(name||"").toLowerCase();
  return /(payroll|nfp|unemployment|gdp|interest rate|rate decision)/.test(n)?"High":/(cpi|inflation|employment|pmi|retail sales|wage|earnings)/.test(n)?"Medium":"Low";

function calendarReleaseTone(e){

  var inverse=/(unemployment rate|jobless claims|initial claims|continuing claims|claimant count|claimant change|jobless)/.test(n);
  var good=inverse ? a<f : a>f;

  absArr.sort(function(x,y){return x-y;});
  var below=0;
  for(var j=0;j<absArr.length;j++){ if(absArr[j]<=a) below++; }

// Common Pair COT engine. Every BASE/QUOTE pair uses the same calculation.

function cotPairRegime(base,quote){
  if(!base||!quote||base===quote) return {label:'Neutral',posLabel:'Neutral',flowLabel:'Neutral',posScore:0,flowScore:0,combined:0,positionAdvantage:null,flowAdvantage:null,insufficient:true};
  var series=cotPairSeries(base,quote);
  if(series.length<8) return {label:'Neutral',posLabel:'Neutral',flowLabel:'Neutral',posScore:0,flowScore:0,combined:0,positionAdvantage:null,flowAdvantage:null,insufficient:true};

  // Current relative values use the two distinct COT concepts requested:
  //   relNet  = BASE Net/OI - QUOTE Net/OI
  //   relFlow = BASE ΔNet - QUOTE ΔNet  (RAW weekly net-contract change)
  // Their signs always retain the BASE-vs-QUOTE meaning.
  var win=series.slice(-52);
  var netArr=win.map(function(r){return r.relNet;}).filter(function(v){return v!=null && Number.isFinite(Number(v));});
  var flowArr=win.filter(function(r){return r.relFlow!=null && Number.isFinite(Number(r.relFlow));}).map(function(r){return r.relFlow;});
  var cur=win[win.length-1];

  // 52-week distribution determines magnitude only. It cannot reverse or
  // erase the BASE/QUOTE direction carried by the underlying relative value.
  var posScore=cotHistoricalMagnitudeScore(cur.relNet,netArr);
  var flowScore=cotHistoricalMagnitudeScore(cur.relFlow,flowArr);
  var combined=0.75*posScore+0.25*flowScore;

  return {
    label:cotPairBand(combined),
    posLabel:cotPairBand(posScore),
    flowLabel:cotPairBand(flowScore),
    posScore:Math.round(posScore*10)/10,
    flowScore:Math.round(flowScore*10)/10,
    combined:Math.round(combined*10)/10,
    positionAdvantage: posScore>0?base:(posScore<0?quote:null),
    flowAdvantage: flowScore>0?base:(flowScore<0?quote:null),
    insufficient:false

}

  var chg=cotLatest(ccy).netChg;

  var a=Math.abs(chg), sign=chg>0?1:-1;

  // position genuinely swung hard this week (e.g. JPY -14.9K) outweighs one that
  // barely ticked (e.g. USD +2.3K), instead of both just counting as a flat +/-1.
  if(a<1000) return 0;

  var spxPct=riskInputNum(row.spxPct), vixPct=riskInputNum(row.vixPct);
  if((spxPct==null || vixPct==null) && prior){

// ===== Canonical pair 2Y yield differential series =====
// ONE source of truth for both the visible Bond Yield Spread chart and the
// pair-level yield score. Every pair observation is exactly: BASE 2Y - QUOTE 2Y,
// converted to basis points.
function pairSpreadSeries(base, quote){
  return y2SortedHistory().map(function(r){
    var a=y2Num(r[base]), b=y2Num(r[quote]);
    return {date:r.date, spread:(a!=null&&b!=null)?(a-b)*100:null};
  }).filter(function(x){return x.spread!=null;});
}

// ===== Pair-level 2Y yield differential score =====
// FX is traded as a pair, so the yield component used by Pair Ranking is relative:
// BASE 2Y yield minus QUOTE 2Y yield. We score that differential directly rather
// than subtracting two independent country yield-regime scores.
function pairYieldCalc(base, quote){
  var currentDate=YIELD_ENGINE.currentDate||'';
  var hist=y2SortedHistory().filter(function(r){
    return y2Num(r[base])!=null && y2Num(r[quote])!=null && (!currentDate || r.date<currentDate);
  });
  var curBase=y2Num((YIELD_ENGINE.current||{})[base]);
  var curQuote=y2Num((YIELD_ENGINE.current||{})[quote]);
  if(curBase==null || curQuote==null){
    var latest=hist.length?hist[hist.length-1]:null;
    if(curBase==null && latest) curBase=y2Num(latest[base]);
    if(curQuote==null && latest) curQuote=y2Num(latest[quote]);
  }
  if(curBase==null || curQuote==null){
    return {pair:base+quote,base:base,quote:quote,current:null,sma21:null,avg60:null,week:null,month:null,smaDist:null,score:null,components:[null,null,null,null,null]};
  }

  // Use the same canonical pair spread series as the visible chart, then
  // overlay the live selected-date observation used for scoring.
  var series=pairSpreadSeries(base,quote);
  var byDate={};
  series.forEach(function(r){ byDate[r.date]=r.spread; });
  var current=(curBase-curQuote)*100;
  var refDateP=currentDate||(series.length?series[series.length-1].date:"");
  if(currentDate) byDate[currentDate]=current;
  var combinedDates=Object.keys(byDate).sort();
  var combinedRows=combinedDates.map(function(d){return {date:d,spread:byDate[d]};});
  var all=combinedRows.map(function(r){return r.spread;}).filter(function(x){return Number.isFinite(x);});
  if(!currentDate && (!all.length || Math.abs(all[all.length-1]-current)>1e-12)) all.push(current);

  // 21D SMA / 60D avg are the last 21 / 60 saved observations (trading-day count, not
  // a calendar-day span). This matches how TradingView's SMA works and what "21D SMA"
  // means to a trader for a market that doesn't trade weekends — a calendar-day span
  // always contains fewer trading days than its number, which was silently shrinking
  // the window. Requires a full 21 / 60 saved points; short of that, no reading yet.
  var upToRefP=combinedRows.filter(function(r){return r.date<=refDateP && Number.isFinite(r.spread);});
  var smaVals=upToRefP.slice(-21).map(function(r){return r.spread;});
  var avgVals=upToRefP.slice(-60).map(function(r){return r.spread;});
  var sma21=smaVals.length>=21?smaVals.reduce(function(a,b){return a+b;},0)/smaVals.length:null;
  var avg60=avgVals.length>=60?avgVals.reduce(function(a,b){return a+b;},0)/avgVals.length:null;

  // Weekly/monthly changes use stored observations before the current observation,
  // matching the existing yield-engine convention. Lookback is date-anchored (see
  // y2ValueOnOrBefore) so an inconsistent update cadence doesn't stretch "week"/"month".
  var histSpreadRows=series.filter(function(r){return !currentDate || r.date<currentDate;});
  var weekTargetP=refDateP?y2AddDays(refDateP,-7):null;
  var monthTargetP=refDateP?y2AddDays(refDateP,-30):null;
  var prev5=y2SpreadOnOrBefore(histSpreadRows,weekTargetP);
  var prev21=y2SpreadOnOrBefore(histSpreadRows,monthTargetP);
  var week=prev5==null?null:current-prev5;
  var month=prev21==null?null:current-prev21;

  // Same 3/2/2/1/2 weighting and -10..+10 scale as the original yield engine,
  // but now applied to the pair\'s actual 2Y differential.
  var c1=sma21==null?null:y2ScoreBand(current-sma21,[-15,-3,3,15],3);
  var c2=week==null?null:y2ScoreBand(week,[-20,-7,7,20],2);
  var c3=month==null?null:y2ScoreBand(month,[-30,-10,10,30],2);
  var c4=avg60==null?null:y2ScoreBand(current-avg60,[-30,-10,10,30],1);
  var prevSma=null;
  if(monthTargetP){
    var valsAsOfMonthAgo=histSpreadRows.filter(function(r){
      return r.date<=monthTargetP && Number.isFinite(r.spread);
    }).map(function(r){return r.spread;}).slice(-21);
    if(valsAsOfMonthAgo.length>=21){
      prevSma=valsAsOfMonthAgo.reduce(function(a,b){return a+b;},0)/valsAsOfMonthAgo.length;
    }
  }
  var todayDist=sma21==null?null:current-sma21;
  var prevDist=(prevSma==null||prev21==null)?null:prev21-prevSma;
  var distChange=(todayDist==null||prevDist==null)?null:todayDist-prevDist;
  var c5=distChange==null?null:y2ScoreBand(distChange,[-12,-3,3,12],2);
  var comps=[c1,c2,c3,c4,c5], weights=[3,2,2,1,2], availWeight=0, rawSum=0;
  comps.forEach(function(x,i){if(x!=null){availWeight+=weights[i];rawSum+=x;}});
  var score=availWeight?Math.round((rawSum/availWeight*10)*10)/10:null;
  return {pair:base+quote,base:base,quote:quote,current:current,sma21:sma21,avg60:avg60,week:week,month:month,smaDist:distChange,score:score,components:comps};
}

function pairCompositeFor(base, quote){
  var db=DATA[base], dq=DATA[quote];
  var fb=fundFor(base), fq=fundFor(quote);
  var fundBase=fb.max?(fb.raw/fb.max):0, fundQuote=fq.max?(fq.raw/fq.max):0;
  var y=pairYieldCalc(base,quote).score;
  var yieldTerm=(y==null?0:y/10);
  var cotTerm=cotPairRegime(base,quote).combined/100;
  var seasBase=seasonalityValue(db), seasQuote=seasonalityValue(dq);
  var riskBase=riskTermFor(base), riskQuote=riskTermFor(quote);
  var cbBase=cbStanceScore(base)/10, cbQuote=cbStanceScore(quote)/10;
  // All Base-vs-Quote differentials are normalized back to -1..1 before weighting.
  var fundPair=(fundBase-fundQuote)/2;
  var cbPair=(cbBase-cbQuote)/2;
  var riskPair=(riskBase-riskQuote)/2;
  var seasPair=(seasBase-seasQuote)/2;
  // Shared macro hierarchy: Fundamentals 55% + Yield 20% + CB Stance 10% + COT 8% + Risk Sentiment 5% + Seasonality 2%.
  return 100*(0.55*fundPair+0.20*yieldTerm+0.10*cbPair+0.08*cotTerm+0.05*riskPair+0.02*seasPair);
}


// Pair Ranking uses its own relative-score bands. Currency Detail keeps the canonical
// currency bands above, while pairs get a narrower neutral zone so small but meaningful

function pairBandLabel(s){

// Pair alignment is descriptive, not an extra scoring pillar. It answers:
// "How much of the weighted evidence is pointing in the same direction as the live pair score?"
// It deliberately uses the same live inputs and the same macro hierarchy as pairCompositeFor.
// No historical-distribution calibration is used.
function pairAlignmentFor(base, quote, score){
  var dir=Number(score)>0.0001?1:(Number(score)<-0.0001?-1:0);
  if(!dir) return null;
  var total=0, agree=0;
  function vote(sign, weight){
    if(sign===0 || !Number.isFinite(Number(weight)) || weight<=0) return;
    total += Number(weight);
    if(sign===dir) agree += Number(weight);
  }
  function indicatorSign(ind){
    return effectiveIndicatorBias(ind);
  }
  function pairIndicatorSign(ccy, ind){
    var sign=indicatorSign(ind);
    return ccy===base ? sign : -sign;
  }
  // Fundamentals occupy 55% of the total model. Each underlying indicator keeps its
  // existing importance inside that pillar; the pillar is normalized to 55 total points.
  var fundWeightSum=0, fundAgreeWeight=0;
  [base,quote].forEach(function(ccy){
    var d=DATA[ccy]||{};
    ['growth','inflation','labour'].forEach(function(group){
      (d[group]||[]).forEach(function(ind){
        if(!indicatorIsUsable(ind)) return;
        var w=Math.abs(Number(ind.weight)||0), sign=pairIndicatorSign(ccy,ind);
        if(!w || !sign) return;
        fundWeightSum += w;
        if(sign===dir) fundAgreeWeight += w;
      });
    });
  });
  if(fundWeightSum>0){
    total += 55;
    agree += 55*(fundAgreeWeight/fundWeightSum);
  }
  // Yield = 20% of the model.
  var y=pairYieldCalc(base,quote).score;
  if(y!=null && Number(y)!==0) vote(Number(y)>0?1:-1,20);
  // COT = 8%. The pair-level COT engine already combines current positioning + weekly flow.
  var cot=cotPairRegime(base,quote);
  if(!cot.insufficient && Number(cot.combined)!==0) vote(Number(cot.combined)>0?1:-1,8);
  // CB stance = 10%. HOLD remains exactly neutral/zero by design.
  var cbDiff=cbStanceScore(base)-cbStanceScore(quote);
  if(cbDiff!==0) vote(cbDiff>0?1:-1,10);
  // Risk = 5%.
  var riskDiff=riskTermFor(base)-riskTermFor(quote);
  if(Math.abs(riskDiff)>0.0001) vote(riskDiff>0?1:-1,5);
  // Seasonality = 2%.
  var seasDiff=seasonalityValue(DATA[base])-seasonalityValue(DATA[quote]);
  if(Math.abs(seasDiff)>0.0001) vote(seasDiff>0?1:-1,2);

function buildPairs(scores){
  var pairs=[];

// Same weighted terms as pairCompositeFor(), just kept separate instead of summed,
// so "Led by" can point at whichever pillar is actually doing the work on a given
// pair. Any change to pairCompositeFor's weights/formula must be mirrored here.
function pairCompositeBreakdown(base, quote){
  var db=DATA[base], dq=DATA[quote];
  var fb=fundFor(base), fq=fundFor(quote);
  var fundBase=fb.max?(fb.raw/fb.max):0, fundQuote=fq.max?(fq.raw/fq.max):0;
  var y=pairYieldCalc(base,quote).score;
  var yieldTerm=(y==null?0:y/10);
  var cotTerm=cotPairRegime(base,quote).combined/100;
  var seasBase=seasonalityValue(db), seasQuote=seasonalityValue(dq);
  var riskBase=riskTermFor(base), riskQuote=riskTermFor(quote);
  var cbBase=cbStanceScore(base)/10, cbQuote=cbStanceScore(quote)/10;
  var fundPair=(fundBase-fundQuote)/2;
  var cbPair=(cbBase-cbQuote)/2;
  var riskPair=(riskBase-riskQuote)/2;
  var seasPair=(seasBase-seasQuote)/2;
  var terms=[
    {name:"Fundamentals",pts:100*0.55*fundPair},
    {name:"Yield",pts:100*0.20*yieldTerm},
    {name:"CB stance",pts:100*0.10*cbPair},
    {name:"COT flow",pts:100*0.08*cotTerm},
    {name:"Risk sentiment",pts:100*0.05*riskPair},
    {name:"Seasonality",pts:100*0.02*seasPair}
  ];

}
// "Led by" should only name drivers actually pushing the pair the way its score
// says it's going -- not just whichever two terms happen to have the biggest raw
// point value regardless of which side they're on. It only considers terms whose
// sign agrees with the pair's overall direction, same idea as the Agree column.
//
// Within those agreeing terms, rank by each pillar's OWN signal strength (Very
// Bullish/Bearish > plain Bullish/Bearish > Leaning > Neutral) before falling back
// to raw point size as a tiebreaker -- not by raw weighted points alone. Points
// alone is misleading here: a pillar like CB stance only carries 10% of the
// composite weight vs Yield's 20%, so even a maxed-out "Very Bearish" CB reading
// can never out-POINT a merely middling Yield reading, and Led by would name
// Yield as a driver while skipping right past a pillar sitting at its own most
// extreme reading. Ranking by each pillar's own strength first keeps Led by
// consistent with what the colored driver strip actually shows -- if Fundamentals
// and CB stance are both showing "Very Bearish" on the strip, those are the two
// names that should show up here, not whichever has the bigger raw number.
function pillarStrengthTier(label){
  if(!label) return 0;
  if(label.indexOf("Very")!==-1) return 2;
  if(label.indexOf("Leaning")!==-1) return 0.5;
  if(label.indexOf("Bullish")!==-1||label.indexOf("Bearish")!==-1) return 1;
  return 0;
}
function scannerDriverBreakdown(base,quote){
  var db=DATA[base], dq=DATA[quote];
  var fb=fundFor(base), fq=fundFor(quote);
  var fundBase=fb.max?(fb.raw/fb.max):0, fundQuote=fq.max?(fq.raw/fq.max):0;
  var y=pairYieldCalc(base,quote);
  var yScore=y.score;
  var cot=cotPairRegime(base,quote);
  var seasBase=seasonalityValue(db), seasQuote=seasonalityValue(dq);
  var riskBase=riskTermFor(base), riskQuote=riskTermFor(quote);
  var cbBase=cbStanceScore(base)/10, cbQuote=cbStanceScore(quote)/10;

  // These are the exact seven evidence columns shown in the scanner:
  // Fundamentals, Yield, CB stance, Position, WoW, Seasonality, Risk.
  // Their contribution is expressed in composite-score points, preserving the
  // model's existing 55/20/10/8/2/5 hierarchy while splitting the COT 8% into
  // its existing 75% position / 25% WoW components.
  var fundPts=55*((fundBase-fundQuote)/2);

  var cbPts=10*((cbBase-cbQuote)/2);

  var riskPts=5*((riskBase-riskQuote)/2);
  var seasPts=2*((seasBase-seasQuote)/2);

    if(Math.abs(n)<0.5) return;

  }
  var out=[];
  push(out,'Fundamentals',fundPts,pillarBias((fundBase-fundQuote)*100));
  push(out,'Yield',yieldPts,yScore==null?'Neutral':(yScore>=7?'Very Bullish':yScore>=3?'Bullish':yScore<=-7?'Very Bearish':yScore<=-3?'Bearish':'Neutral'));
  push(out,'CB stance',cbPts,pairCbStanceLabel(base,quote));
  push(out,'Position',posPts,cot.posLabel);
  push(out,'WoW',flowPts,cot.flowLabel);
  push(out,'Seasonality',seasPts,seasonalityPairText(base,quote));

}

function scannerTrendSpark(pair,animate){

  if(allDays.length<2) return '<span style="color:var(--text-faint);font-size:11px;">&mdash;</span>';

  var loggedVals=loggedDays.map(function(dt){ return DAILY[dt][pair]; });
  var live=liveValueForTrendKey(pair);
  var merged=live==null?{days:loggedDays,vals:loggedVals,liveIdx:-1}:withLiveToday(loggedDays,loggedVals,live,TREND_WINDOW_DAYS);
  var days=merged.days, vals=merged.vals, liveIdx=merged.liveIdx;
  if(vals.length<2) return '<span style="color:var(--text-faint);font-size:11px;">&mdash;</span>';
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals); if(min===max){min-=5;max+=5;}
  var range=max-min;
  var pts=vals.map(function(v,i){var x=pad+(i/(vals.length-1))*(w-2*pad),y=h-pad-((v-min)/range)*(h-2*pad);return [x,y];});

    liveDot+

var scannerTipHideTimer=null;
function bindScannerHoverTooltips(){
  var els=document.querySelectorAll('#tab-scanner [data-scanner-tip]:not([data-scanner-tip=""])');

    var el=els[i];
    if(el.__scannerTipBound) continue;
    el.__scannerTipBound=true;
    var enter=function(ev){
      var e=ev.currentTarget, txt=e.getAttribute('data-scanner-tip')||'';
      if(!txt) return;
      if(scannerTipHideTimer){ clearTimeout(scannerTipHideTimer); scannerTipHideTimer=null; }
      var tt=ensureScannerHoverTooltip();
      tt.innerHTML=txt;
      tt.classList.toggle('scanner-pair-hover', e.classList.contains('scanner-pair-td'));
      tt.classList.add('show');
      positionScannerHoverTooltip(ev);
    };
    var move=function(ev){
      var tt=ensureScannerHoverTooltip();
      if(tt.classList.contains('show')) positionScannerHoverTooltip(ev);
    };
    var leave=function(){
      // Don't hide the instant the cursor crosses into the next row -- that's what
      // caused the flicker. Give the next pointerenter a brief window to cancel this
      // and swap the content in place instead, so hopping pair-to-pair stays smooth
      // and it only actually disappears once the cursor truly leaves the table.
      if(scannerTipHideTimer) clearTimeout(scannerTipHideTimer);

        scannerTipHideTimer=null;

  }

  if(!DATA) return;
  var pairsAll=buildPairs(allScores());
  var pairs=pairsAll.filter(function(p){

    return scannerFilters.indexOf(scannerBucket(p.score))!==-1;
  });
  // Grouped Long -> Neutral -> Short (never mixed), ranked by conviction within each group.
  // Within each Long/Neutral/Short group, always rank highest score to lowest.
  // (The Short group used to sort the OTHER way -- most negative first -- which
  // put Very Bearish at the TOP of the Short section and worked its way UP toward
  // Neutral by the bottom. That breaks the natural flow of conviction: it should
  // read Very Bullish -> Bullish -> Leaning Bullish -> Neutral -> Leaning Bearish
  // -> Bearish -> Very Bearish top to bottom, continuously, which just means every
  // group sorts the same way -- descending by the actual signed score.)
  pairs=pairs.slice().sort(function(a,b){
    var ga=scannerSideGroup(a), gb=scannerSideGroup(b);

      (carry>0 ? CCY_NAME[p.base]+' pays '+Math.abs(carry).toFixed(2)+' percentage points more in policy-rate carry than '+CCY_NAME[p.quote]+'.' :
       carry<0 ? CCY_NAME[p.quote]+' pays '+Math.abs(carry).toFixed(2)+' percentage points more in policy-rate carry than '+CCY_NAME[p.base]+'.' :
       ((DATA[p.base]&&parseNum(DATA[p.base].interestRate)&&parseNum(DATA[p.base].interestRate).num>0) ? 'Both currencies pay '+Math.abs(carry).toFixed(2)+'% to hold, so neither has a carry advantage.' : 'Both policy rates are 0%, so neither currency pays a carry premium to hold.'));

function fmt(n){ return (n>0?"+":"") + Math.round(n); }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

function parseNum(s){
  if(s===undefined||s===null) return null;
  var t=String(s).trim();
  if(t===""||t==="-"||t==="—") return null;
  var m=t.match(/^([+-]?[\d,.]+)\s*(%|k|K|m|M)?$/);
  if(!m) return null;
  var num=parseFloat(m[1].replace(/,/g,""));
  if(isNaN(num)) return null;
  return {num:num, suffix:m[2]||""};
}
function surpriseFor(actual,forecast,name){
  var a=parseNum(actual), f=parseNum(forecast);
  if(!a||!f) return "—";
  var diff=a.num-f.num;
  if(indicatorIsInverse(name)) diff=-diff;
  var suf=a.suffix||f.suffix||"";
  var rounded=Math.round(diff*100)/100;
  var out=(rounded>0?"+":"")+ (Math.abs(rounded)<10? rounded.toFixed(2).replace(/0+$/,"").replace(/\.$/,""): Math.round(rounded));
  return out+suf;
}

// ===== Economic Surprise Momentum (auto-derived from actual vs forecast, no new data entry) =====
var MOMENTUM_DECAY = 0.85; // ~4 releases for a print to lose half its weight
var MOMENTUM_CCYS = ["USD","GBP","EUR","JPY","AUD","NZD","CAD","CHF"];
var MOMENTUM_PENDING={}; // debounce actual/forecast edits so one release is processed once after both fields settle

// Rough "typical move" divisors so a GDP beat and a CPI beat land on a comparable scale.
// Matched by keyword in the indicator name (checked in order), falling back to unit suffix.
var SURPRISE_DIVISORS = [
  ["gdp",0.5],["pmi",1.5],["ism",1.5],["confidence",8],["sentiment",3],
  ["cpi",0.3],["inflation",0.3],["pce",0.3],["ppi",0.5],
  ["payroll",60],["nfp",60],["employment change",20],
  ["unemployment rate",0.2],["claimant",15],["jobless",15],
  ["earnings",0.3],["wage",0.3],["retail sales",0.4]
];
function surpriseDivisor(name, suffix){
  var n=(name||"").toLowerCase();
  for(var i=0;i<SURPRISE_DIVISORS.length;i++){ if(n.indexOf(SURPRISE_DIVISORS[i][0])!==-1) return SURPRISE_DIVISORS[i][1]; }
  if(suffix==="%") return 0.4;
  if(suffix==="k"||suffix==="K") return 30;
  return 1;
}
function initMomentum(){
  if(!DATA) return;
  if(!DATA.MOMENTUM){ DATA.MOMENTUM={}; }
  MOMENTUM_CCYS.forEach(function(ccy){
    if(!DATA.MOMENTUM[ccy]) DATA.MOMENTUM[ccy]={score:0,history:[]};
  });
}
// Apply one completed actual/forecast print to the momentum engine.
// A fingerprint prevents the same release from being applied repeatedly if the
// user edits the same field again or both Actual and Forecast fire change events.
function updateMomentum(ccy, sector, idx){
  initMomentum();
  var ind=DATA[ccy] && DATA[ccy][sector] && DATA[ccy][sector][idx];
  if(!ind) return;
  var a=parseNum(ind.actual), f=parseNum(ind.forecast);
  if(!a || !f) return;
  var todayKey=new Date().toISOString().slice(0,10);
  var key=ccy+'|'+sector+'|'+idx;
  var meta=DATA._MOMENTUM_PROCESSED||(DATA._MOMENTUM_PROCESSED={});
  var releaseKey=todayKey+'|'+key;
  // Release identity excludes editable values, preventing same-day corrections from
  // being counted as a second economic event.
  if(meta[releaseKey]) return;
  meta[releaseKey]=true;
  var rawDiff=a.num-f.num;
  var directionalDiff=indicatorIsInverse(ind.name)?-rawDiff:rawDiff;
  var div=surpriseDivisor(ind.name,a.suffix||f.suffix);
  var standardized=clamp(directionalDiff/div,-3,3);
  var m=DATA.MOMENTUM[ccy];
  m.score=clamp(MOMENTUM_DECAY*m.score+(1-MOMENTUM_DECAY)*standardized,-3,3);
  m.history.push({date:todayKey,score:Math.round(m.score*100)/100,releaseKey:releaseKey});
  if(m.history.length>26) m.history.shift();
}

function queueMomentumUpdate(ccy, sector, idx){
  var key=ccy+'|'+sector+'|'+idx;
  if(MOMENTUM_PENDING[key]) clearTimeout(MOMENTUM_PENDING[key]);
  MOMENTUM_PENDING[key]=setTimeout(function(){ delete MOMENTUM_PENDING[key]; updateMomentum(ccy,sector,idx); scheduleSave(); updateComputed(); }, 450);
}
function momentumLabel(score){
  if(score>=1.5) return "Very Strong";
  if(score>=0.5) return "Strong";
  if(score>-0.5) return "Neutral";
  if(score>-1.5) return "Weak";
  return "Very Weak";
}
function renderMomentumSparkline(history){
  if(!history || !history.length) return "";
  var w=110,h=28,pad=2;
  var vals=history.map(function(h){return h.score;});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(min===max){ min-=1; max+=1; }
  var pts=vals.map(function(v,i){
    var x=pad+(i/(vals.length-1||1))*(w-2*pad);
    var y=h-pad-((v-min)/(max-min))*(h-2*pad);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="display:block;overflow:visible;">'+
    '<polyline fill="none" stroke="currentColor" stroke-width="1.5" points="'+pts+'"/></svg>';
}
// Drop this anywhere in a currency tile/card template, e.g.: ${renderMomentumTile('USD')}
function renderMomentumTile(ccy){
  initMomentum();
  var m = (DATA.MOMENTUM && DATA.MOMENTUM[ccy]) || {score:0,history:[]};
  var label = momentumLabel(m.score);
  var cls = m.score>0.5?"Bullish":(m.score<-0.5?"Bearish":"Neutral");
  return '<div class="momentum-tile" title="Auto-derived from actual-vs-forecast surprises, decayed over recent releases">'+
    '<span class="bias-select '+cls+'" style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;">'+
      (m.score>=0?"+":"")+m.score.toFixed(1)+' &middot; '+label+
    '</span>'+
    '<div style="margin-top:4px;color:inherit;opacity:.85;">'+renderMomentumSparkline(m.history)+'</div>'+
  '</div>';
}

  var btns=document.querySelectorAll("#themeSwitch .theme-btn");

function y2Num(v){
  if(v==null) return null;
  var s=String(v).replace(/%/g,"").replace(/,/g,"").trim();
  if(s==="") return null;
  var n=Number(s);
  return Number.isFinite(n)?n:null;
}
function y2SplitCsvLine(line){
  var out=[], cur='', inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){cur+='"'; i++;} else inQ=false; }
      else cur+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ out.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}
function y2DateKey(v){
  var d=new Date(v+"T00:00:00");
  return isNaN(d.getTime())?null:d.toISOString().slice(0,10);
}
function y2TodayKey(){ return new Date().toISOString().slice(0,10); }
function y2SortedHistory(){
  // Canonical daily-close history: exactly one row per date and never a future/open-session row.
  // Any accidental entry for today or a future date is excluded from the live/exported history.
  var byDate={};
  var today=y2TodayKey();
  (YIELD_ENGINE.history||[]).forEach(function(r){
    if(!r || !r.date) return;
    var d=y2DateKey(r.date)||String(r.date);
    if(d>=today) return;
    byDate[d]=Object.assign({},r,{date:d});
  });
  return Object.keys(byDate).sort().map(function(d){return byDate[d];});
}
function y2RemoveUnfinishedToday(){
  var today=y2TodayKey(), by={}, removed=false;
  (YIELD_ENGINE.history||[]).forEach(function(r){
    if(!r || !r.date) return;
    if(r.date>=today){ removed=true; return; }
    by[r.date]=Object.assign({},by[r.date]||{},r,{date:r.date});
  });
  if(removed) YIELD_ENGINE.history=Object.keys(by).sort().map(function(d){return by[d];});
  if(removed) y2SetCurrentFromLatestSaved();
  return removed;
}
function y2SetCurrentFromLatestSaved(){
  var rows=y2SortedHistory();
  var selected=YIELD_ENGINE.inputDate||'';
  if(selected){
    YIELD_ENGINE.currentDate=selected;
    var picked=rows.find(function(r){return r.date===selected;});
    if(picked){
      YIELD_ENGINE.current={};
      Y2_CCY_ORDER.forEach(function(c){ if(picked[c]!=null) YIELD_ENGINE.current[c]=y2Num(picked[c]); });
    }
    return;
  }
  if(!rows.length){
    YIELD_ENGINE.currentDate=YIELD_ENGINE.currentDate||'';
    YIELD_ENGINE.current=YIELD_ENGINE.current||{};
    return;
  }
  var latest=rows[rows.length-1];
  YIELD_ENGINE.currentDate=latest.date;
  YIELD_ENGINE.inputDate=latest.date;
  YIELD_ENGINE.current={};
  Y2_CCY_ORDER.forEach(function(c){if(latest[c]!=null) YIELD_ENGINE.current[c]=y2Num(latest[c]);});
}
function y2PrevClose(ccy){
  // The previous close is the immediately preceding stored trading-day close,
  // never today's temporary input and never a weekend placeholder.
  var currentDate=YIELD_ENGINE.currentDate||'';
  var hist=y2SortedHistory().filter(function(r){
    return y2Num(r[ccy])!=null && (!currentDate || r.date<currentDate);
  });
  if(!hist.length) return null;
  return y2Num(hist[hist.length-1][ccy]);
}
// --- Date-aware lookback helpers -------------------------------------------------
// These replace "N saved observations back" with "the closest saved observation to
// an actual calendar date N days back." This keeps "week"/"month" honest even when
// daily closes aren't saved every single trading day. If updates ARE saved every
// trading day, these produce the same result as before.
function y2AddDays(dateStr, days){
  var d=new Date(dateStr+"T00:00:00Z");
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
// Finds the value on-or-before targetDate from a date-ascending-sorted row list.
function y2ValueOnOrBefore(sortedRows, ccy, targetDate){
  if(!targetDate) return null;
  for(var i=sortedRows.length-1;i>=0;i--){
    if(sortedRows[i].date<=targetDate){
      var v=y2Num(sortedRows[i][ccy]);
      if(v!=null) return v;
    }
  }
  return null;
}
// Finds the value on-or-before targetDate for a plain {date, spread} series (pair spreads).
function y2SpreadOnOrBefore(sortedRows, targetDate){
  if(!targetDate) return null;
  for(var i=sortedRows.length-1;i>=0;i--){
    if(sortedRows[i].date<=targetDate && Number.isFinite(sortedRows[i].spread)) return sortedRows[i].spread;
  }
  return null;
}
// 21-period SMA "as of" a given calendar date: last N saved points on-or-before that
// date (trading-day count, matching the live SMA definition). Keeps the acceleration
// component consistent with what the main SMA actually means.
function y2SmaAsOfDate(sortedRows, ccy, targetDate, windowDays, minPoints){
  if(!targetDate) return null;
  minPoints=minPoints==null?windowDays:minPoints;
  var vals=[];
  for(var i=0;i<sortedRows.length;i++){
    if(sortedRows[i].date<=targetDate){
      var v=y2Num(sortedRows[i][ccy]);
      if(v!=null) vals.push(v);
    }
  }
  vals=vals.slice(-windowDays);
  if(vals.length<minPoints) return null;
  return vals.reduce(function(a,b){return a+b;},0)/vals.length;
}
function y2ScoreBand(x, thresholds, maxScore){
  if(x==null) return 0;
  maxScore=maxScore==null?2:maxScore;
  var midScore=maxScore===1?1:Math.max(1,Math.round(maxScore/2));
  if(x>=thresholds[3]) return maxScore;
  if(x>=thresholds[2]) return midScore;
  if(x<=thresholds[0]) return -maxScore;
  if(x<=thresholds[1]) return -midScore;
  return 0;
}
function y2Calc(ccy){
  var hist=y2SortedHistory().filter(function(r){return y2Num(r[ccy])!=null;});
  var cur=y2Num((YIELD_ENGINE.current||{})[ccy]);
  if(cur==null && hist.length) cur=y2Num(hist[hist.length-1][ccy]);
  if(cur==null) return {ccy:ccy,current:null,sma21:null,avg60:null,week:null,month:null,smaDist:null,score:null,components:[null,null,null,null,null],histCount:hist.length};

  // Normalize the historical series by date before calculating moving averages.
  // When the current observation is for a date that already exists in history,
  // replace that day's stored value instead of appending a duplicate observation.
  var byDate={};
  hist.forEach(function(r){ byDate[r.date]=Object.assign({},r); });
  var currentDate=YIELD_ENGINE.currentDate||"";
  if(currentDate){
    byDate[currentDate]=Object.assign({},byDate[currentDate]||{date:currentDate},{date:currentDate,_current:true});
    byDate[currentDate][ccy]=cur;
  }
  var combined=Object.keys(byDate).sort().map(function(d){return byDate[d];});
  if(!combined.length || (!currentDate && y2Num(combined[combined.length-1][ccy])!==cur)){
    combined=combined.concat([{date:currentDate||"9999-12-31",_current:true,[ccy]:cur}]);
  }

  var all=combined.map(function(r){return y2Num(r[ccy]);}).filter(function(x){return x!=null;});
  // 21D SMA / 60D avg are the last 21 / 60 saved observations (trading-day count, not
  // a calendar-day span). This matches how TradingView's SMA works and what "21D SMA"
  // means to a trader for a market that doesn't trade weekends — a calendar-day span
  // always contains fewer trading days than its number, which was silently shrinking
  // the window. Requires a full 21 / 60 saved points; short of that, no reading yet.
  var refDate=currentDate||(hist.length?hist[hist.length-1].date:"");
  var upToRef=combined.filter(function(r){return r.date<=refDate && y2Num(r[ccy])!=null;});
  var smaVals=upToRef.slice(-21).map(function(r){return y2Num(r[ccy]);});
  var avgVals=upToRef.slice(-60).map(function(r){return y2Num(r[ccy]);});
  var sma21=smaVals.length>=21?smaVals.reduce(function(a,b){return a+b;},0)/smaVals.length:null;
  var avg60=avgVals.length>=60?avgVals.reduce(function(a,b){return a+b;},0)/avgVals.length:null;

  // Weekly/monthly changes deliberately use the stored historical observations
  // that precede the current observation, so the current close is never counted twice.
  // Lookback is date-anchored (closest saved close to 7/30 calendar days back), so
  // gaps in your update cadence don't silently stretch what "week"/"month" measure.
  var weekTarget=refDate?y2AddDays(refDate,-7):null;
  var monthTarget=refDate?y2AddDays(refDate,-30):null;
  var prev5=y2ValueOnOrBefore(hist,ccy,weekTarget);
  var prev21=y2ValueOnOrBefore(hist,ccy,monthTarget);
  var week=prev5==null?null:cur-prev5;
  var month=prev21==null?null:cur-prev21;

  // Five confluences are kept, but their influence is balanced by information value:
  // 1) position vs 21D trend is the main short-term anchor (3 points),
  // 2) 1-week change confirms current momentum (2),
  // 3) 1-month change confirms persistence (2),
  // 4) 60D position is a slower structural check (1),
  // 5) change in the 21D distance measures acceleration/deceleration (2).
  // Total possible yield score remains exactly -10 to +10.
  var c1=sma21==null?null:y2ScoreBand((cur-sma21)*100,[ -15,-3,3,15 ],3);
  var c2=week==null?null:y2ScoreBand(week*100,[ -20,-7,7,20 ],2);
  var c3=month==null?null:y2ScoreBand(month*100,[ -30,-10,10,30 ],2);
  var c4=avg60==null?null:y2ScoreBand((cur-avg60)*100,[ -30,-10,10,30 ],1);
  var todayDist=sma21==null?null:(cur-sma21)*100;
  var prevSma=y2SmaAsOfDate(hist,ccy,monthTarget,21,21);
  var prevDist=(prevSma==null||prev21==null)?null:(prev21-prevSma)*100;
  var distChange=(todayDist==null||prevDist==null)?null:todayDist-prevDist;
  var c5=distChange==null?null:y2ScoreBand(distChange,[ -12,-3,3,12 ],2);
  var comps=[c1,c2,c3,c4,c5];
  // Normalize to the full -10..+10 scale using only components that are available.
  // A missing component no longer blanks the entire yield score. The component
  // weights remain 3/2/2/1/2, so partial-history reads preserve the same scale.
  var compWeights=[3,2,2,1,2];
  var availCount=0, availWeight=0, rawSum=0;
  comps.forEach(function(x,i){
    if(x!=null){ availCount++; availWeight+=compWeights[i]; rawSum+=x; }
  });
  var complete=availCount===5;
  var score=availWeight>0 ? Math.round((rawSum/availWeight*10)*10)/10 : null;
  return {ccy:ccy,current:cur,sma21:sma21,avg60:avg60,week:week,month:month,smaDist:distChange,score:score,components:comps,complete:complete,availCount:availCount,histCount:hist.length};
}

function y2ScoreClass(x){ return x==null?'y2-neutral':x>0?'y2-positive':x<0?'y2-negative':'y2-neutral'; }
function y2FmtPct(x){ return x==null?'—':x.toFixed(3)+'%'; }
function y2FmtBp(x){ return x==null?'—':(x>0?'+':'')+x.toFixed(1)+' bp'; }
function y2ScoreFmt(x){ return x==null?'—':(x>0?'+':'')+x; }
function y2CompClass(x){ return x==null?'y2-comp miss':(x>0?'y2-comp pos':(x<0?'y2-comp neg':'y2-comp neu')); }
function y2CompFmt(x){ return x==null?'—':(x>0?'+':'')+x; }
function y2ScoreCell(r){
  return '<div class="mono '+y2ScoreClass(r.score)+'">'+y2ScoreFmt(r.score)+'</div>';
}
function y2CsvEscape(v){ var s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function y2ExportCsv(){
  var rows=y2SortedHistory();
  var header=['Date'].concat(Y2_CCY_ORDER.map(function(c){return c+'_2Y';}));
  var lines=[header.join(',')];
  rows.forEach(function(r){lines.push([r.date].concat(Y2_CCY_ORDER.map(function(c){return y2Num(r[c])==null?'':y2Num(r[c]);})).map(y2CsvEscape).join(','));});
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='TWP_2Y_Yield_Master.csv'; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},500);
}
function y2ImportCsvText(text){
  // Master CSV import protocol:
  // - The imported file is authoritative for every date it contains.
  // - Existing dates are updated, not duplicated.
  // - Dates that are older than the import file and not present in it are preserved.
  // - Duplicate dates inside the imported file collapse to one row.
  // - The newest imported date becomes the live current observation so arrows,
  //   SMA inputs and score calculations immediately use the imported close.
  var lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(x){return x.trim();});
  if(!lines.length) throw new Error('CSV is empty.');
  var header=y2SplitCsvLine(lines[0]).map(function(x){return x.trim().replace(/^"|"$/g,'');});
  var idx={}; header.forEach(function(h,i){idx[h]=i;});
  if(idx.Date==null) throw new Error('CSV must contain a Date column.');

  var importedByDate={};
  for(var i=1;i<lines.length;i++){
    var parts=y2SplitCsvLine(lines[i]);
    parts=parts.slice(0,header.length).map(function(x){return x.replace(/^"|"$/g,'').replace(/""/g,'"').trim();});
    var date=y2DateKey(parts[idx.Date]);
    if(!date) continue;
    var r={date:date};
    Y2_CCY_ORDER.forEach(function(c){
      var k=c+'_2Y';
      if(idx[k]==null) return;
      var n=y2Num(parts[idx[k]]);
      if(n!=null) r[c]=n;
    });
    importedByDate[date]=r;
  }

  var importedDates=Object.keys(importedByDate).sort();
  if(!importedDates.length) throw new Error('CSV contains no valid dated rows.');

  var existingByDate={};
  (YIELD_ENGINE.history||[]).forEach(function(r){
    if(r && r.date) existingByDate[y2DateKey(r.date)||r.date]=Object.assign({},r);
  });
  var originalCount=Object.keys(existingByDate).length;
  var added=0, updated=0, unchanged=0;

  importedDates.forEach(function(date){
    var incoming=importedByDate[date];
    var old=existingByDate[date];
    if(!old){
      existingByDate[date]=incoming;
      added++;
      return;
    }
    var changed=false;
    var merged=Object.assign({},old,{date:date});
    Y2_CCY_ORDER.forEach(function(c){
      if(incoming[c]!=null){
        if(old[c]==null || Math.abs(Number(old[c])-Number(incoming[c]))>0.0000001) changed=true;
        merged[c]=incoming[c];
      }
    });
    existingByDate[date]=merged;
    if(changed) updated++; else unchanged++;
  });

  YIELD_ENGINE.history=Object.keys(existingByDate).sort().map(function(k){return existingByDate[k];});

  // The imported file is the current master history. Promote its newest row to
  // current state so the day-over-day arrows compare the new close with the prior one.
  var latestDate=importedDates[importedDates.length-1];
  var latestRow=existingByDate[latestDate];
  YIELD_ENGINE.currentDate=latestDate;
  YIELD_ENGINE.current={};
  Y2_CCY_ORDER.forEach(function(c){
    if(latestRow[c]!=null) YIELD_ENGINE.current[c]=latestRow[c];
  });
  // The latest imported close is the latest SAVED close. The date picker must
  // therefore remain on that stored trading date (e.g. Aug 17), never today's
  // unfinished candle (e.g. Aug 18). The user changes the date to Aug 18 only
  // when tomorrow morning's close is ready to be saved.
  y2DateTouchedThisSession=true;

  return {
    originalCount:originalCount,
    newAdded:added,
    updatedExisting:updated,
    unchangedExisting:unchanged,
    finalCount:YIELD_ENGINE.history.length,
    importedDates:importedDates,
    latestDate:latestDate
  };
}

function renderYield2Y(){
  var rows=y2SortedHistory(), latest=rows.length?rows[rows.length-1].date:'—';
  var html='<div class="y2-grid">'+
    '<div class="card"><h3>Current 2Y Yield Input</h3><div class="y2-input-grid">'+

function histSpreadDraw(animate){
  if(HIST_SPREAD_ANIM_ID){ cancelAnimationFrame(HIST_SPREAD_ANIM_ID); HIST_SPREAD_ANIM_ID=null; }
  var canvas=document.getElementById("histSpreadCanvas"), empty=document.getElementById("histSpreadEmpty");
  var stats=document.getElementById("histSpreadStats"), select=document.getElementById("histSpreadPair");
  if(!canvas || !select) return;
  var code=select.value || HIST_SPREAD_ACTIVE;
  HIST_SPREAD_ACTIVE=code;
  var rows=histSpreadRows(code).slice(-HIST_SPREAD_RANGE);
  var ctx=canvas.getContext("2d");
  var rect=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  var W=Math.max(280,rect.width), H=Math.max(240,rect.height);
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(!rows.length){
    if(empty) empty.textContent="No historical observations for "+histSpreadLabel(code)+". Import a CSV containing the seven 2Y yield columns first.";
    if(stats) stats.innerHTML="";
    return;
  }
  if(empty) empty.textContent=rows.length<2?"Need at least two historical observations to draw the spread.":"";
  if(rows.length<2){ if(stats) stats.innerHTML=""; return; }

  var vals=rows.map(function(x){return x.spread;});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);

  /* Robust vertical scale: a single stale/outlier yield observation must not
     flatten the entire spread series against the bottom/top of the panel.
     The true series is still drawn, but extreme points are clipped to the
     visible plotting range instead of determining the scale. */
  var scaleVals=vals.slice().sort(function(a,b){return a-b;});
  function pct(arr,p){
    if(!arr.length) return 0;
    var idx=(arr.length-1)*p, lo=Math.floor(idx), hi=Math.ceil(idx);
    if(lo===hi) return arr[lo];
    return arr[lo]+(arr[hi]-arr[lo])*(idx-lo);
  }
  if(scaleVals.length>=8){
    var p05=pct(scaleVals,0.05), p95=pct(scaleVals,0.95);
    if(Number.isFinite(p05)&&Number.isFinite(p95)&&p95>p05){ min=p05; max=p95; }
  }
  /* The percentile clip above exists to stop a stale/bad mid-series print from
     flattening the chart -- it was never meant to also mute today's live
     reading, which is exactly the real breakout move a trader needs to see.
     So the most recent observation always gets to set/extend the scale, even
     if it lands outside the 5th-95th percentile band. */
  var lastVal=vals[vals.length-1];
  if(Number.isFinite(lastVal)){
    if(lastVal>max) max=lastVal;
    if(lastVal<min) min=lastVal;
  }
  if(min===max){min-=10;max+=10;}

  var compact=W<=600;
  var veryCompact=W<=380;
  var pad=compact
    ? {l:veryCompact?52:56,r:veryCompact?14:18,t:16,b:50}
    : {l:58,r:16,t:14,b:34};
  var pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  var extra=(max-min)*0.12; min-=extra; max+=extra;
  function X(i){return pad.l+(i/(rows.length-1))*pw;}
  function Y(v){
    var clipped=Math.max(min,Math.min(max,v));
    return pad.t+(max-clipped)/(max-min)*ph;
  }

  var styles=getComputedStyle(document.body);
  var textDim=styles.getPropertyValue("--text-dim").trim()||"#565e6d";
  var textFaint=styles.getPropertyValue("--text-faint").trim()||"#8991a0";
  var bullish=styles.getPropertyValue("--bullish").trim()||"#2dbb78";
  var bearish=styles.getPropertyValue("--bearish").trim()||"#d9535f";

  var lineColor=vals[vals.length-1]>=vals[0]?bullish:bearish;
  var lastX=X(rows.length-1), lastY=Y(vals[vals.length-1]);

  /* Date labels are deliberately sparse and use a short human-readable format.
     The first and last labels are edge-aligned so neither can be clipped. */
  var labelCount=compact?4:6;
  labelCount=Math.min(labelCount,rows.length);
  var labelIndexes=[];
  if(labelCount===1){ labelIndexes=[0]; }
  else{
    for(var li=0;li<labelCount;li++) labelIndexes.push(Math.round(li*(rows.length-1)/(labelCount-1)));
  }
  function shortDate(iso){
    var parts=String(iso).slice(0,10).split("-");
    if(parts.length!==3) return String(iso).slice(0,10);
    var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return Number(parts[2])+" "+(months[Number(parts[1])-1]||parts[1])+" '"+String(parts[0]).slice(2);
  }
  // Paints the whole frame; `reveal` (0..1) is how far across the plot width the
  // spread line has been traced so far. Axis/date labels stay fully drawn the whole
  // time -- only the line (and its latest-value dot, which only appears once the
  // line has reached it) sweeps in. At reveal=1 this is identical to a plain static
  // draw of the chart.
  function paintChart(reveal){
    ctx.clearRect(0,0,W,H);

    /* Clean plotting field: no grid, no positive/negative shading, no zero-axis line. */
    ctx.font=compact?"10px Inter, sans-serif":"11px Inter, sans-serif";
    ctx.textBaseline="middle";
    ctx.textAlign="right";
    var axisSteps=compact?3:4;
    for(var a=0;a<=axisSteps;a++){
      var av=min+(max-min)*(a/axisSteps), ay=Y(av);
      ctx.fillStyle=textDim;
      ctx.fillText(av.toFixed(0)+" bp",pad.l-7,ay);
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(pad.l,0,Math.max(0,pw*reveal),H);
    ctx.clip();
    ctx.strokeStyle=lineColor;ctx.lineWidth=compact?1.2:1.3;ctx.lineJoin="miter";ctx.lineCap="butt";
    ctx.beginPath();
    rows.forEach(function(r,i){var xx=X(i),yy=Y(r.spread);if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);});
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle=textFaint;ctx.textBaseline="top";
    ctx.font=compact?"10px IBM Plex Mono, monospace":"10.5px IBM Plex Mono, monospace";
    for(var di=0;di<labelIndexes.length;di++){
      var idx=labelIndexes[di], xx=X(idx), label=shortDate(rows[idx].date);
      if(idx===0) ctx.textAlign="left";
      else if(idx===rows.length-1) ctx.textAlign="right";
      else ctx.textAlign="center";
      ctx.fillText(label,xx,H-pad.b+12);
    }

    /* Always emphasize the latest observation without cluttering the plot -- but
       only once the sweeping line has actually reached it. */
    if(reveal>=0.999){
      ctx.fillStyle=lineColor;ctx.beginPath();ctx.arc(lastX,lastY,compact?3:3.2,0,Math.PI*2);ctx.fill();
    }
  }

  if(animate){
    paintChart(0);
    var animStart=null, animDur=650;
    HIST_SPREAD_ANIM_ID=requestAnimationFrame(function step(ts){
      if(animStart===null) animStart=ts;
      var t=Math.min(1,(ts-animStart)/animDur), eased=1-Math.pow(1-t,3);
      paintChart(eased);
      if(t<1){ HIST_SPREAD_ANIM_ID=requestAnimationFrame(step); }
      else { HIST_SPREAD_ANIM_ID=null; }
    });
  } else {
    paintChart(1);
  }

  var current=vals[vals.length-1], first=vals[0], high=Math.max.apply(null,vals), low=Math.min.apply(null,vals);
  var change=current-first;
  var spreadStyles=getComputedStyle(document.body);
  var liveEl=document.getElementById("histSpreadLiveValue");
  var liveMeta=document.getElementById("histSpreadLiveMeta");
  if(liveEl){
    liveEl.textContent=histSpreadFmt(current);
    liveEl.style.color=current>0?(spreadStyles.getPropertyValue("--bullish-strong").trim()||bullish):(current<0?(spreadStyles.getPropertyValue("--bearish-strong").trim()||bearish):(spreadStyles.getPropertyValue("--text-dim").trim()||textDim));
  }
  if(liveMeta){
    var p=HIST_SPREAD_PAIRS.find(function(x){return x[0]===code;});
    liveMeta.textContent=(p?p[1]+" / "+p[2]:code)+" · "+rows[rows.length-1].date;
  var liveChange=document.getElementById("histSpreadLiveChange");
  if(liveChange){ liveChange.innerHTML="Change <span>"+histSpreadFmt(change)+"</span>"; var __chgStyles=getComputedStyle(document.body); liveChange.style.color=change>0?(__chgStyles.getPropertyValue("--bullish-strong").trim()||"#2dbb78"):(change<0?(__chgStyles.getPropertyValue("--bearish-strong").trim()||"#d9535f"):"var(--text-dim)"); }
  }
  if(stats) stats.innerHTML="";

  var hoverDot=document.getElementById("histSpreadHoverDot");
  var hoverTip=document.getElementById("histSpreadTraceTip");
  canvas.__histSpreadState={rows:rows,vals:vals,W:W,H:H,pad:pad,X:X,Y:Y,lineColor:lineColor};
  if(!canvas.__histSpreadHoverBound){
    canvas.__histSpreadHoverBound=true;
    function spreadTrace(ev){
      var st=canvas.__histSpreadState;
      if(!st || st.rows.length<2) return;
      var rr=canvas.getBoundingClientRect();
      var px=Math.max(st.pad.l,Math.min(st.W-st.pad.r,ev.clientX-rr.left));
      var plotW=st.W-st.pad.l-st.pad.r;
      var ratio=plotW<=0?0:(px-st.pad.l)/plotW;
      var idx=Math.max(0,Math.min(st.rows.length-1,Math.round(ratio*(st.rows.length-1))));
      var x=st.X(idx), y=st.Y(st.vals[idx]);
      if(hoverDot){
        hoverDot.style.left=x+'px';
        hoverDot.style.top=y+'px';
        hoverDot.classList.toggle('bear',st.vals[idx]<0);
        hoverDot.style.display='block';
      }
      if(hoverTip){
        var v=st.vals[idx], row=st.rows[idx];
        hoverTip.innerHTML='<div class="d">'+esc(row.date)+' · '+esc(histSpreadLabel(HIST_SPREAD_ACTIVE))+'</div><div class="v" style="color:'+(v>0?'var(--bullish-strong)':v<0?'var(--bearish-strong)':'var(--text-dim)')+'">'+esc(histSpreadFmt(v))+'</div>';
        hoverTip.style.display='block';
        var tw=hoverTip.offsetWidth||132, th=hoverTip.offsetHeight||38;
        var left=x+12, top=y-th-10;
        if(left+tw>W-6) left=x-tw-12;
        if(top<6) top=y+10;
        hoverTip.style.left=Math.max(6,left)+'px';
        hoverTip.style.top=Math.max(6,top)+'px';
      }
    }
    function endSpreadTrace(){
      if(hoverDot) hoverDot.style.display='none';
      if(hoverTip) hoverTip.style.display='none';
    }
    canvas.addEventListener("pointermove",spreadTrace,{passive:true});
    canvas.addEventListener("mousemove",spreadTrace,{passive:true});
    canvas.addEventListener("pointerenter",spreadTrace,{passive:true});
    canvas.addEventListener("pointerleave",endSpreadTrace);
    canvas.addEventListener("mouseleave",endSpreadTrace);
  }
}
