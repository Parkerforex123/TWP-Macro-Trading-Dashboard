  CHF:'#d8a23b', AUD:'#45b99e', CAD:'#df5a76', NZD:'#7fbd5d'
};

function overviewCsiHistory(scores){
  /* The label is a real 90-calendar-day window, not a count of logged observations.
     Missing days stay empty so the chart never invents data. */
  var keys=CCYS.slice();
  var today=new Date();
  var todayKey=today.toISOString().slice(0,10);
  var days=[];
  for(var di=TREND_WINDOW_DAYS-1;di>=0;di--){
    var d=new Date(today);
    d.setUTCDate(d.getUTCDate()-di);
    days.push(d.toISOString().slice(0,10));
  }
  var raw={};
  keys.forEach(function(c){
    raw[c]=days.map(function(dt){
      if(dt===todayKey) return Number(scores[c]);
      return DAILY[dt] && Number.isFinite(Number(DAILY[dt][c])) ? Number(DAILY[dt][c]) : null;
    });
  });
  /* IMPORTANT: Composite Strength is the actual composite score history.
     Do not rebase each currency to 100 independently. Re-basing makes a currency
     that merely moved the most from its own starting point appear to 'fly' above
     the others, even when its current composite score is not the strongest.
     The chart must use the same absolute score shown in Composite Ranking. */
  var out={days:days,series:{}};
  keys.forEach(function(c){
    out.series[c]=raw[c].map(function(v){return v==null?null:v;});
  });
  return out;
}

function overviewCsiSparkline(ccy,vals,color){
  var good=vals.filter(function(v){return v!=null;});
  if(good.length<2) return '<span class="ov-csi-nohist">—</span>';
  var w=92,h=24,p=2,min=Math.min.apply(null,good),max=Math.max.apply(null,good);
  if(min===max){min-=.5;max+=.5;}
  var pts=[],n=vals.length;
  vals.forEach(function(v,i){
    if(v==null) return;

function labelFromScore(s){return bandLabel(s);}
// 90-calendar-day trend for a single currency's composite score -- same mechanic as pairTrend30d,
// just against DATA.MOMENTUM-style daily snapshots stored per-currency in DAILY under the
// currency's own key (e.g. DAILY[date]["USD"]) if you're logging single-currency composites.
// Falls back gracefully to "flat/no history" if you haven't been logging that yet.
function trendDaysForKey(key){
  var todayKey=new Date().toISOString().slice(0,10);
  var cutoff=new Date(todayKey+'T00:00:00Z');
  cutoff.setUTCDate(cutoff.getUTCDate()-(TREND_WINDOW_DAYS-1));
  var cutoffKey=cutoff.toISOString().slice(0,10);
  return Object.keys(DAILY).filter(function(dt){return DAILY[dt] && DAILY[dt][key]!==undefined && dt>=cutoffKey && dt<=todayKey;}).sort();
}
function trendDirectionFromLatest(key, liveVal){
  var todayKey=new Date().toISOString().slice(0,10);
  var days=Object.keys(DAILY).filter(function(dt){ return DAILY[dt] && DAILY[dt][key]!==undefined && dt!==todayKey; }).sort();
  if(!days.length || !Number.isFinite(Number(liveVal))) return null;
  var previous=Number(DAILY[days[days.length-1]][key]);
  if(!Number.isFinite(previous)) return null;
  var d=Number(liveVal)-previous;
  return d>0?"up":d<0?"down":"flat";
}
function ccyTrend30d(ccy, liveScore){
  var allDays=Object.keys(DAILY).filter(function(dt){ return DAILY[dt] && DAILY[dt][ccy]!==undefined; }).sort();
  if(!allDays.length) return {dir:"flat",delta:null,label:"No trend history yet"};
  var days=trendDaysForKey(ccy), first=Number(DAILY[days[0]][ccy]), delta=Math.round(liveScore-first);
  // The arrow must describe the SAME comparison as the delta number shown next to it (today
  // vs the start of this window) -- deriving it from trendDirectionFromLatest (today vs only
  // yesterday) answers a different question and can point the opposite way from a delta
  // that's clearly positive or negative over the full window.
  var dir=delta>0?"up":delta<0?"down":"flat";
  var label=dir==="up"?"Score up vs "+TREND_WINDOW_DAYS+"d ago":dir==="down"?"Score down vs "+TREND_WINDOW_DAYS+"d ago":"Score unchanged vs "+TREND_WINDOW_DAYS+"d ago";
  return {dir:dir,delta:delta,label:label};
}
function ccyTrendMarker(ccy, liveScore){

  var scoreCls=Number(liveScore)>=15?"score-regime-bull":(Number(liveScore)<=-15?"score-regime-bear":"score-regime-neutral");

}

function parseSurpriseNumber(v){
  if(v==null || v==="") return null;
  var str=String(v).trim().replace(/,/g,"");
  if(!str || str==="—" || str==="–" || str.toLowerCase()==="n/a") return null;
  var mult=1;
  if(/k$/i.test(str)){mult=1000;str=str.slice(0,-1);}
  else if(/m$/i.test(str)){mult=1000000;str=str.slice(0,-1);}
  str=str.replace(/%/g,"");
  var n=parseFloat(str);
  return Number.isFinite(n)?n*mult:null;
}
function surpriseRatio(actual,forecast,name){
  var a=parseSurpriseNumber(actual), f=parseSurpriseNumber(forecast);
  if(a==null||f==null)return null;
  var denom=Math.max(Math.abs(a),Math.abs(f),1);
  var diff=a-f;
  if(indicatorIsInverse(name)) diff=-diff;
  return Math.max(-100,Math.min(100,(diff/denom)*100));
}
function surpriseDataForCurrency(ccy){
  var d=DATA[ccy],rows=[],cats=["growth","inflation","labour"];
  if(!d)return {avg:0,strongBeats:0,strongMisses:0,total:0,rows:[]};
  var weightedSum=0,weightTotal=0;
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci],list=Array.isArray(d[cat])?d[cat]:[];
    for(var i=0;i<list.length;i++){
      var r=list[i],sr=surpriseRatio(r.actual,r.forecast,r.name),estimated=false;
      if(sr==null){
        if(r.bias==="Bullish") sr=10; else if(r.bias==="Bearish") sr=-10; else continue;
        estimated=true;
      }
      var w=Number(r.weight); if(!Number.isFinite(w)||w<=0) w=1;
      rows.push({ccy:ccy,category:cat,name:r.name||"Release",actual:r.actual,forecast:r.forecast,ratio:sr,weight:w,estimated:estimated});
      weightedSum += sr*w; weightTotal += w;
    }
  }
  var avg=weightTotal?weightedSum/weightTotal:0;
  var strongBeats=rows.filter(function(r){return r.ratio>=15;}).length;
  var strongMisses=rows.filter(function(r){return r.ratio<=-15;}).length;
  rows.sort(function(a,b){return Math.abs(b.ratio*b.weight)-Math.abs(a.ratio*a.weight);});
  return {avg:avg,strongBeats:strongBeats,strongMisses:strongMisses,total:rows.length,rows:rows};
}
function surpriseLabel(score){
  if(score>=15)return "Strongly Beating";
  if(score>=5)return "Beating";
  if(score<=-15)return "Strongly Missing";
  if(score<=-5)return "Missing";
  return "Near Forecast";
}
// Surprise Index gauges now run on the exact same weighted signed-sum formula as the
// Currency Detail sidebar's Fundamentals score -- Growth + Inflation + Labour, each
// indicator contributing +weight (beat), -weight (miss), 0 (tie), or its manual
// Bullish/Neutral/Bearish dropdown when there's no forecast to compare -- via the same
// fundFor(ccy). This replaced an earlier "beat rate" version (% of releases that beat,
// unweighted, ignoring magnitude) which could disagree with the Fundamentals score
// because it didn't account for weight or size of beat/miss. fundFor(ccy).raw IS the
// Fundamentals score number; it's rescaled here to a 0-100 dial position purely for the
// gauge face (50 = neutral, 100 = every point of weight beat, 0 = every point missed) --
// the sign and ranking behind that percentage are identical to the Fundamentals score.
function surpriseWeightedPct(ccy){
  var f=fundFor(ccy);
  if(!f.max) return {pct:null,raw:f.raw,max:f.max};
  var norm=Math.max(-1,Math.min(1, f.raw/f.max));
  return {pct:Math.round(50+norm*50),raw:f.raw,max:f.max};
}
// Full-circle dial gauge (0-100%), ~270deg sweep with a gap at the bottom: a solid, fully
// filled red(low)->grey(mid)->blue(high) diverging heat map (not a thin outline ring), with
// a small arrow marker at the needle tip -- matching the reference dashboard style. cx/cy/r
// sized per gauge.
function pctGaugeAngle(cx,cy,r,v){ var angle=225-(v/100*270), rad=angle*Math.PI/180; return {x:cx+r*Math.cos(rad), y:cy-r*Math.sin(rad)}; }
// Small arrowhead marker at the needle tip, pointing outward along the needle's own
// direction, in place of the old large ball marker.
function needleArrowPoints(cx,cy,tx,ty){
  var dx=tx-cx, dy=ty-cy, len=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/len, uy=dy/len, px=-uy, py=ux;
  var apex={x:tx+ux*4,y:ty+uy*4}, base={x:tx-ux*6,y:ty-uy*6};
  var b1={x:base.x+px*3.6,y:base.y+py*3.6}, b2={x:base.x-px*3.6,y:base.y-py*3.6};
  return apex.x.toFixed(1)+','+apex.y.toFixed(1)+' '+b1.x.toFixed(1)+','+b1.y.toFixed(1)+' '+b2.x.toFixed(1)+','+b2.y.toFixed(1);
}
// Diverging colour ramp shared by the gauge track and the rank table's heat chips.
// Pulls its red/green directly from the same --bearish-strong / --bullish-strong hex
// values (#f23645 / #089981) that already color the "Crowded Long/Short" chips on the
// COT tab -- not an invented palette. Anything below 30% or above 70% renders as the
// full, undiluted brand colour (matches how the COT chip looks -- solid, not washed
// out); only the 30-70 band blends through a neutral grey so the gauge still reads as
// a gradient rather than a hard flip.
function pctDivergingRgbArr(pct){
  var t=Math.max(0,Math.min(100,pct))/100;
  var lo=[242,54,69], mid=[150,150,156], hi=[8,153,129];
  if(t<=0.3) return lo;
  if(t>=0.7) return hi;
  var a,b,k;
  if(t<=0.5){ a=lo; b=mid; k=(t-0.3)/0.2; } else { a=mid; b=hi; k=(t-0.5)/0.2; }
  return [Math.round(a[0]+(b[0]-a[0])*k), Math.round(a[1]+(b[1]-a[1])*k), Math.round(a[2]+(b[2]-a[2])*k)];
}
function pctDivergingRgb(pct,alpha){ var c=pctDivergingRgbArr(pct); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha==null?1:alpha)+')'; }
function pctGaugeArcs(cx,cy,r){
  var N=40, out="";
  for(var i=0;i<N;i++){
    var v0=i*(100/N), v1=(i+1)*(100/N);
    var p0=pctGaugeAngle(cx,cy,r,v0), p1=pctGaugeAngle(cx,cy,r,v1);
    // Filled pie wedge from the centre out to the rim (not a thin stroked ring) so the whole
    // dial reads as a solid heat map instead of a coloured outline around a black centre.
    out += '<path d="M '+cx+' '+cy+' L '+p0.x.toFixed(2)+' '+p0.y.toFixed(2)+' A '+r+' '+r+' 0 0 1 '+p1.x.toFixed(2)+' '+p1.y.toFixed(2)+' Z" fill="'+pctDivergingRgb((v0+v1)/2,0.88)+'" stroke="none"/>';
  }
  return out;
}
// Minimal end-cap ticks only (no 0/20/40/60/80/100 labels) -- keeps the dial clean
// like the reference gauge, which just shows small marks at the two extremes.
function pctGaugeTicks(cx,cy,r){
  var vals=[0,100], out="";
  for(var i=0;i<vals.length;i++){
    var v=vals[i], p1=pctGaugeAngle(cx,cy,r+2,v), p2=pctGaugeAngle(cx,cy,r+8,v);
    out += '<line x1="'+p1.x.toFixed(2)+'" y1="'+p1.y.toFixed(2)+'" x2="'+p2.x.toFixed(2)+'" y2="'+p2.y.toFixed(2)+'" stroke="var(--text-faint)" stroke-width="1.4"/>';
  }
  return out;
}
// Heat colour for the rank table's Score chip: reads the same brand-colour value the
// gauge track uses at that percentage (single source of truth for both), just
// wrapped in a translucent chip background + light foreground text.
function surpriseHeatColor(pct){
  if(pct==null) return {bg:'rgba(255,255,255,.06)',fg:'var(--text-dim)'};
  var c=pctDivergingRgbArr(pct), dist=Math.abs(pct-50)/50, alpha=0.22+0.55*dist;
  var fg=pct>=50?'#bdf5e4':'#ffd6da';
  return {bg:'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha.toFixed(2)+')', fg:fg};

function surpriseGaugeSvg(ccy,pct){
  var cx=75,cy=64,r=40, val=pct==null?50:pct;
  var tip=pctGaugeAngle(cx,cy,r-9,val), rest=pctGaugeAngle(cx,cy,r-9,0);
  var nx=tip.x, ny=tip.y, nx0=rest.x, ny0=rest.y;
  // Needle+ball are drawn at their 0% rest position and swept round to the live
  // value by animateSurpriseGauges() right after this markup lands in the DOM.
  // Because renderRaw() rebuilds this HTML from scratch every time the Economic
  // Surprise Index tab is (re)rendered -- including every time it's switched back
  // into -- the sweep replays itself each time you return to the tab.
  // Requested: currency code + percentage drawn INSIDE the dial itself (as SVG text),
  // not as separate label/value elements sitting above and below it -- that's what
  // let the reference gauges sit so close together, since there's nothing outside the
  // circle taking up extra vertical space. The Beating/Missing/Near Forecast chip is

function showCcyTrendTooltip(svg, idx, clientX, clientY){
  var days=(svg.getAttribute('data-days')||'').split(',').filter(Boolean);
  var valsAttr=(svg.getAttribute('data-vals')||'').split(',').filter(function(v){return v!=="";});
  var liveIdx=Number(svg.getAttribute('data-live-idx'));
  var ccy=svg.getAttribute('data-ccy')||'';
  var day=days[idx];
  // Read the score straight off the rendered series (data-vals) instead of re-querying DAILY --
  // the live "today" point isn't in DAILY until the next Recalculate, so a DAILY lookup would
  // silently fail to show a tooltip for it.
  if(!day || valsAttr[idx]===undefined) return;
  var score=Number(valsAttr[idx]);
  var isLive=idx===liveIdx;
  var tt=ensurePairScoreTooltip();
  tt.innerHTML='<div class="tt-date">'+esc(isLive?'Live (today)':formatShortDate(day))+' · '+esc(ccy)+'</div><div class="tt-score">Score '+fmt(score)+'</div><div class="tt-regime" style="color:'+(score>0?'var(--bullish-strong)':score<0?'var(--bearish-strong)':'var(--text-dim)')+'">'+esc(bandLabel(score))+'</div>';
  tt.style.display='block';
  var rect=tt.getBoundingClientRect();
  var x=Math.min(clientX+12, window.innerWidth-rect.width-8);
  var y=Math.min(clientY+12, window.innerHeight-rect.height-8);
  tt.style.left=Math.max(8,x)+'px'; tt.style.top=Math.max(8,y)+'px';
}
function updateCcyTrendCrosshair(svg, idx){
  var days=(svg.getAttribute('data-days')||'').split(',').filter(Boolean);
  if(days.length<2) return;
  idx=Math.max(0,Math.min(days.length-1,idx));
  var dot=svg.querySelector('.detail-trend-hover-dot'), cross=svg.querySelector('.detail-trend-crosshair'), hit=svg.querySelectorAll('.detail-trend-hit');
  if(!dot||!cross||!hit[idx]) return;
  dot.setAttribute('cx',hit[idx].getAttribute('cx')); dot.setAttribute('cy',hit[idx].getAttribute('cy')); cross.setAttribute('opacity','1');
}
function bindDetailTrendHover(){
  var svgs=document.querySelectorAll('#tab-detail .detail-trend-spark');
  for(var i=0;i<svgs.length;i++){
    var svg=svgs[i];
    if(svg.__detailTrendHoverBound) continue;
    svg.__detailTrendHoverBound=true;
    var move=function(ev){
      var el=ev.currentTarget, days=(el.getAttribute('data-days')||'').split(',').filter(Boolean);
      if(days.length<2) return;
      // Account for the left-side axis-label gutter added for the Y-axis: the plotted
      // points start after the gutter, not at x=0, so the hover ratio must be measured
      // from the gutter's edge, not the full SVG width, to still land on the right day.
      var gutter=Number(el.getAttribute('data-axis-gutter'))||0, viewW=Number(el.getAttribute('data-view-w'))||1;
      var r=el.getBoundingClientRect(), gutterPx=(gutter/viewW)*r.width;
      var x=ev.clientX-r.left-gutterPx, plotPx=r.width-gutterPx;
      var ratio=Math.max(0,Math.min(1,plotPx>0?x/plotPx:0)), idx=Math.round(ratio*(days.length-1));
      updateCcyTrendCrosshair(el,idx); showCcyTrendTooltip(el,idx,ev.clientX,ev.clientY);
    };
    var end=function(ev){ hidePairScoreTooltip(); var c=ev.currentTarget.querySelector('.detail-trend-crosshair'); if(c)c.setAttribute('opacity','0'); };
    svg.addEventListener('pointermove',move); svg.addEventListener('pointerenter',move); svg.addEventListener('pointerleave',end); svg.addEventListener('pointerdown',move);
  }
}

function policyStanceInfo(ccy){
  var d=DATA[ccy]||{};
  var move=(d.nextMove||"HOLD").toUpperCase();
  var conviction=(d.conviction||"Medium conviction").toLowerCase();
  var sign=move==="HIKE"?1:(move==="CUT"?-1:0);
  var base=move==="HIKE"?"Hawkish":(move==="CUT"?"Dovish":"Neutral");
  var strong=(conviction.indexOf("high")>=0);
  var very=(strong && sign!==0);
  var label=very?(sign>0?"Very Hawkish":"Very Dovish"):base;
  var cls=sign>0?"policy-bull":(sign<0?"policy-bear":"policy-neutral");
  return {sign:sign,label:label,cls:cls,move:move,conviction:d.conviction||"Medium conviction"};
}
function policyMarketInfo(ccy){
  var p=policyStanceInfo(ccy), y=y2Calc(ccy).score;
  var marketSign=(y!=null && y>=2)?1:(y!=null && y<=-2)?-1:0;
  var market=y==null?"No 2Y signal":(y>=6?"Strongly rising":y>=2?"Rising":y<=-6?"Strongly falling":y<=-2?"Falling":"Steady");
  var relCls="policy-neutral", rel="No clear comparison";
  if(p.sign!==0 && marketSign===p.sign){ rel="They agree"; relCls="policy-match"; }
  else if(p.sign!==0 && marketSign===-p.sign){ rel="They disagree"; relCls="policy-diverge"; }
  else if(p.sign!==0 && marketSign===0){ rel="Market not confirming"; relCls="policy-watch"; }
  else if(p.sign===0 && marketSign>0){ rel="Market is starting to price a hike"; relCls="policy-watch"; }
  else if(p.sign===0 && marketSign<0){ rel="Market is starting to price a cut"; relCls="policy-watch"; }
  else if(p.sign===0 && marketSign===0){ rel="Both are neutral"; relCls="policy-match"; }
  return {policy:p,market:market,marketSign:marketSign,relation:rel,relationCls:relCls,y:y};
}

function smoothPath(pts){
  if(pts.length<2) return "";
  var d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1)+" ";
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i===0?0:i-1], p1=pts[i], p2=pts[i+1], p3=pts[i+2<pts.length?i+2:i+1];
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d += "C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1)+" ";

  for(var i=1;i<pts.length;i++){ d += "L"+pts[i][0].toFixed(1)+","+pts[i][1].toFixed(1)+" "; }

}

// the big expanded-pair chart so the two stay visually consistent.

  if(pts.length<2) return "";

  var d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1)+" ";
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+="C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1)+" ";

  if(!lookback) return days;

}

// not score). This is calendar-day anchored (like the week/month lookbacks elsewhere), NOT a
// fixed count of logged observations: it finds the 7th calendar day back from today, then
// compares the live score to the most recent day you actually logged on or before that date.
// That way a gap in your logging (a skipped weekend, a missed day) never silently turns this
// into a 12-day or 16-day comparison -- it always anchors to the real 7-day calendar mark.
function last7DayDelta(key, liveVal){
  var todayKey=new Date().toISOString().slice(0,10);

  var cutoffKey=cutoff.toISOString().slice(0,10);
  var priorDays=Object.keys(DAILY).filter(function(dt){ return DAILY[dt] && DAILY[dt][key]!==undefined && dt!==todayKey && dt<=cutoffKey; }).sort();
  if(!priorDays.length) return {dir:"flat",delta:null,day:null};
  var anchorDay=priorDays[priorDays.length-1]; // closest logged day on/before the 7-day-ago mark
  var delta=Math.round(liveVal-Number(DAILY[anchorDay][key]));
  if(delta>0) return {dir:"up",delta:delta,day:anchorDay};
  if(delta<0) return {dir:"down",delta:delta,day:anchorDay};

  }

function pairTrend30d(pair){

function updatePairTrendCrosshair(svg, idx){

function pairPassesFilter(bias){
  if(pairFilters.indexOf("All")!==-1) return true;
  if(pairFilters.indexOf("Extremes")!==-1 && (bias==="Very Bullish"||bias==="Very Bearish")) return true;
  return pairFilters.indexOf(bias)!==-1;
}
function sortExtremePairs(pairs){
  var bulls=pairs.filter(function(p){ return p.bias==="Very Bullish"; }).sort(function(a,b){ return b.score-a.score; });
  var bears=pairs.filter(function(p){ return p.bias==="Very Bearish"; }).sort(function(a,b){ return a.score-b.score; });
  return bulls.concat(bears);
}
function pairMacroSummaryHtml(pair, score){
  var base=pair.slice(0,3), quote=pair.slice(3,6);
  var fb=fundFor(base), fq=fundFor(quote);
  var fundRel=(fb.max?(100*fb.raw/fb.max):0)-(fq.max?(100*fq.raw/fq.max):0);
  var y=pairYieldCalc(base,quote), yScore=y.score;
  var cot=cotPairRegime(base,quote);
  var riskDiff=100*0.03*(riskTermFor(base)-riskTermFor(quote));
  var riskState=riskPairState(base,quote);
  var seas=seasonalityPairSpread(base,quote);
  var overall=pairBandLabel(score);
  var baseData=DATA[base]||{}, quoteData=DATA[quote]||{};
  var cotBase=cotLatest(base), cotQuote=cotLatest(quote);

  function clean(v){ return String(v==null?'':v).replace(/\s+/g,' ').trim(); }
  function num(v){ return v==null?'':String(v); }
  function sideName(){ return score>0?base:score<0?quote:'neither'; }
  function labelWord(){
    if(score>=25) return ['decisive','the stronger side is clearly in front'];
    if(score>=8) return ['constructive','the balance is leaning in favour of '+base];
    if(score<=-25) return ['decisive','the stronger side is clearly in front'];
    if(score<=-8) return ['fragile','the balance is leaning in favour of '+quote];
    return ['two-sided','the pair does not have a dominant macro winner'];
  }
  function biasSign(ind){
    return ind && ind.bias==='Bullish' ? 1 : ind && ind.bias==='Bearish' ? -1 : 0;
  }
  function effectFor(ccy, ind){
    var b=biasSign(ind);
    return ccy===base ? b : -b;
  }
  function allIndicators(){
    var out=[];
    [base,quote].forEach(function(ccy){
      var d=DATA[ccy]||{};
      ['growth','inflation','labour'].forEach(function(group){
        (d[group]||[]).forEach(function(ind){
          var effect=effectFor(ccy,ind);
          var wt=Math.abs(Number(ind.weight)||0);
          if(effect!==0) out.push({ccy:ccy,group:group,ind:ind,effect:effect,weight:wt});
        });
      });
    });
    return out;
  }
  var facts=allIndicators();
  var supportive=facts.filter(function(x){return x.effect>0;}).sort(function(a,b){return b.weight-a.weight;});
  var opposing=facts.filter(function(x){return x.effect<0;}).sort(function(a,b){return b.weight-a.weight;});
  function factText(x){
    if(!x) return '';
    var n=clean(x.ind.name), a=num(x.ind.actual), f=num(x.ind.forecast);
    if(a && f && f!=='-' && f!=='—') return x.ccy+' '+n+' '+a+' vs '+f+' forecast';
    if(a) return x.ccy+' '+n+' '+a;
    return x.ccy+' '+n+' is '+clean(x.ind.bias||'neutral').toLowerCase();
  }
  function groupName(g){ return g==='growth'?'growth':g==='inflation'?'inflation':'labour'; }
  function groupScore(f,g){
    var x=f[g]; return x.max?(100*x.raw/x.max):0;
  }
  function strongestGroup(f){
    var arr=[['growth',groupScore(f,'g')],['inflation',groupScore(f,'inf')],['labour',groupScore(f,'l')]];
    arr.sort(function(a,b){return Math.abs(b[1])-Math.abs(a[1]);});
    return arr[0];
  }
  function topFundLine(){
    if(!supportive.length && !opposing.length) return 'The macro data is unusually quiet here: nothing in growth, inflation or labour is creating a strong relative impulse yet.';
    var s=strongestGroup(score>=0?fb:fq), leader=score>=0?base:quote;
    if(Math.abs(fundRel)<5) return 'The data is mixed rather than one-way. The strongest information is coming from '+leader+' '+groupName(s[0])+', but the gap is not wide enough to call this a clean fundamental trend.';
    if(supportive.length>=2) return 'The real story is the breadth of the data rather than one headline. '+factText(supportive[0])+' and '+factText(supportive[1])+' are pulling the macro balance toward '+(supportive[0].effect>0?base:quote)+'.';
    return 'The cleanest data signal is '+factText(supportive[0]||opposing[0])+', which is doing most of the work behind the relative fundamental call.';
  }
  function rateNarrative(){
    if(yScore==null) return 'The rate layer is incomplete, so the yield market cannot yet be used as a strong confirmation signal.';
    var bp=Math.round(y.current);
    if(Math.abs(bp)<5) return 'The 2Y spread is only '+(bp>=0?'+':'')+bp+'bp. That leaves the rate story almost flat, so this pair is being decided more by data and positioning than by a clear yield advantage.';
    var winner=bp>0?base:quote;
    var reinforces=(score>0&&bp>0)||(score<0&&bp<0);
    if(reinforces) return 'Rates are helping the same side as the composite: the 2Y spread sits at '+(bp>0?'+':'')+bp+'bp in favour of '+winner+'. That matters because the data story is not standing alone; the rate market is backing it.';
    return 'Rates are the awkward part of the picture. The 2Y spread is '+(bp>0?'+':'')+bp+'bp in favour of '+winner+', but the broader composite leans the other way. That is the tension worth respecting rather than smoothing over.';
  }
  function cotNarrative(){
    if(cot.insufficient) return 'COT is still too thin to carry the argument. Treat positioning as background information until the pair has a usable history.';
    var bn=(cotBase.oi&&cotBase.net!=null)?100*cotBase.net/cotBase.oi:null;
    var qn=(cotQuote.oi&&cotQuote.net!=null)?100*cotQuote.net/cotQuote.oi:null;
    var winner=cot.combined>5?base:(cot.combined<-5?quote:'neither');
    var flowBase=cotBase.netChg==null?0:cotBase.netChg;
    var flowQuote=cotQuote.netChg==null?0:cotQuote.netChg;
    var flowWinner=flowBase>flowQuote?base:flowBase<flowQuote?quote:'neither';
    if(winner!=='neither'){
      var norm=winner===base?bn:qn;
      var raw=winner===base?cotBase.net:cotQuote.net;
      var move=winner===flowWinner?(flowBase===flowQuote?'positioning is broadly unchanged':'the weekly flow is moving the same way'):('the weekly flow is moving against it');
      return 'Positioning leans toward '+winner+(norm!=null?' with net positioning at roughly '+norm.toFixed(1)+'% of open interest':'')+' (raw net '+cotFormat(raw)+'). '+move+'. That makes COT a useful confirmation or warning flag, not a substitute for the macro story.';
    }
    return 'COT is not giving the pair a clean institutional winner right now. The useful question is whether the weekly flow starts separating the two currencies; until then, positioning is a secondary signal.';
  }
  function riskNarrative(){
    if(!riskHasAnyReading()) return 'Risk sentiment is not populated enough to add a meaningful pair distinction.';
    if(riskState==='Neutral') return 'Risk is not separating the two legs enough to matter. It is background rather than a driver here.';
    return 'Risk is '+riskState.toLowerCase()+' for the pair, so the broader market regime is '+(riskDiff>0?'giving '+base:'giving '+quote)+' some support. It matters, but it is still a smaller input than fundamentals and rates.';
  }
  function seasonNarrative(){
    var sl=seasonalityBandLabelFromValue(seas);
    if(sl==='Neutral') return 'Seasonality is neutral. There is no meaningful calendar tailwind to lean on, which keeps the trade anchored to the live macro picture.';
    return 'Seasonality is '+sl.toLowerCase()+' for '+(seas>0?base:quote)+'. Think of it as timing rather than the reason for the trade: it can reinforce a move, but it should not overrule the macro evidence.';
  }

  var conflicts=[];
  if(fundRel*score<0 && Math.abs(fundRel)>=7) conflicts.push('fundamentals');
  if(yScore!=null && y.current*score<0 && Math.abs(y.current)>=10) conflicts.push('rates');
  if(cot.combined*score<0 && Math.abs(cot.combined)>=6) conflicts.push('positioning');
  if(riskDiff*score<0 && Math.abs(riskDiff)>=4) conflicts.push('risk');
  if(seas*score<0 && Math.abs(seas)>=0.75) conflicts.push('seasonality');

  var side=sideName(), story=labelWord();
  var lead;
  if(side==='neither'){
    lead='There is no clean hero in '+pair+'. The dashboard is reading a two-sided macro market, so the important question is which pillar breaks the balance first rather than forcing a directional story that the evidence does not support.';
  } else {
    lead=pair+' is '+story[0]+': '+side+' has the upper hand, but the quality of that edge depends on whether the other macro pillars confirm it. The score tells you who is in front; the read below explains why.';
  }

  var divergence;
  if(conflicts.length===0){
    divergence='The pieces are broadly pulling in the same direction. That is the cleaner kind of setup: data, rates and the supporting layers are not fighting the main signal. The next risk is not contradiction, but a fresh piece of information strong enough to change that alignment.';
  } else if(conflicts.length===1){
    divergence='The important tension is '+conflicts[0]+'. That is where I would look first for divergence: if it keeps disagreeing while the headline score stays firm, the pair is carrying more internal conflict than the headline bias suggests.';
  } else {
    divergence='This is not a one-way macro story. '+conflicts.slice(0,3).join(', ')+' are not fully agreeing with the composite, so the quality of the signal matters more than the label. The best confirmation will come from the pillars moving back into alignment, not from a bigger score alone.';
  }

  var conclusion;
  if(side==='neither'){
    conclusion='Bottom line: neutrality here is not a blank verdict. It means the market lacks a dominant macro force at this moment. Watch the next meaningful data or rate repricing for the first clean separation between the two currencies.';
  } else if(conflicts.length===0){
    conclusion='Bottom line: '+side+' has the cleaner macro story. The signal becomes more trustworthy if the same side keeps winning in the data and the rate market while positioning does not become excessively stretched.';
  } else if(conflicts.length<=2){
    conclusion='Bottom line: '+side+' still leads, but it is not a free pass. The disagreement above is the part of the dashboard that can invalidate the simple headline bias, so it deserves more attention than the score itself.';
  } else {
    conclusion='Bottom line: the headline bias is weaker than it looks because several pillars are pulling against it. This is the type of pair where waiting for confirmation can be more valuable than interpreting every small move as a new trend.';
  }

  var blocks=[
    lead,
    topFundLine(),
    rateNarrative(),
    cotNarrative(),
    riskNarrative()+ ' '+seasonNarrative(),
    divergence,
    conclusion
  ];

  return '<div class="pair-macro-summary">'+
    '<div class="pair-macro-summary-head"><span>Macro read · analyst brief</span><b class="'+pillarBiasClass(overall)+'">'+overall+'</b></div>'+
    '<div class="pair-macro-lead">'+esc(blocks[0])+'</div>'+
    blocks.slice(1,6).map(function(t){return '<div class="pair-macro-line">'+esc(t)+'</div>';}).join('')+
    '<div class="pair-macro-verdict">'+esc(blocks[6])+'</div>'+
  '</div>';
}

function cotCommitInputs(ccy,tab){
  if(!unlockedLocally) return;
  var li=tab.querySelector('[data-cot-field="long"][data-ccy="'+ccy+'"]'), si=tab.querySelector('[data-cot-field="short"][data-ccy="'+ccy+'"]');
  var long=cotNum(li&&li.value), short=cotNum(si&&si.value);
  if(long==null||short==null){updateStatus('Enter both long and short contracts first.','var(--amber)');return;}
  var date=cotNextTuesday(COT_ENGINE.inputDate || COT_ENGINE.currentDate || new Date().toISOString().slice(0,10));
  // If this currency already has a saved row for THIS SAME week with these exact
  // long/short numbers, re-clicking Save is a no-op resave, not a real weekly update.
  // Letting it through used to (a) diff the row against itself -> WoW change of 0, and
  // (b) still count as "this currency is done for the week", which could falsely
  // complete the round and auto-advance the input week before every currency actually
  // had new figures entered. Block it here instead.
  var oiInput=tab.querySelector('[data-cot-field="oi"][data-ccy="'+ccy+'"]'), enteredOi=cotNum(oiInput&&oiInput.value);
  var existingThisWeek=null;
  for(var ei=0;ei<COT_ENGINE.history.length;ei++){var er=COT_ENGINE.history[ei]; if(er&&er.ccy===ccy&&er.date===date){existingThisWeek=er;break;}}
  if(existingThisWeek && cotNum(existingThisWeek.long)===long && cotNum(existingThisWeek.short)===short && (enteredOi==null || cotNum(existingThisWeek.oi)===enteredOi)){
    updateStatus(ccy+' — already saved for '+date+' with these numbers (no change to record).','var(--amber)');
    return;
  }
  // Exclude any existing row for THIS SAME date before picking "previous" -- otherwise
  // re-saving (or saving twice in one week) treats this week's own just-saved row as
  // "previous", diffs it against itself, and always yields a WoW change of 0.
  var rows=cotSortHistory(ccy).filter(function(r){return r.date!==date;}), previous=rows.length?rows[rows.length-1]:null;
  var net=long-short, netChg=previous?net-cotNum(previous.net):null;
  var longChg=previous&&cotNum(previous.long)!=null?long-cotNum(previous.long):null;
  var shortChg=previous&&cotNum(previous.short)!=null?short-cotNum(previous.short):null;
  var oi=enteredOi;
  // Never silently carry a prior week's OI into a new observation. OI is contemporaneous.
  var cur={date:date,long:long,short:short,longChg:longChg,shortChg:shortChg,net:net,netChg:netChg,oi:oi};
  COT_ENGINE.current[ccy]=cur; COT_ENGINE.currentDate=date;
  var all=COT_ENGINE.history.filter(function(r){return !(r.ccy===ccy&&r.date===date);}); all.push({ccy:ccy,date:date,long:long,short:short,longChg:longChg,shortChg:shortChg,net:net,netChg:netChg,oi:oi});
  var perCcy=all.filter(function(r){return r.ccy===ccy;}).sort(function(a,b){return String(a.date).localeCompare(String(b.date));}).slice(-52);
  COT_ENGINE.history=all.filter(function(r){return r.ccy!==ccy;}).concat(perCcy);
  enforceCot52WeekWindow();
  syncCotLegacyFields(ccy);
  var complete=CCYS.every(function(x){return COT_ENGINE.current[x] && COT_ENGINE.current[x].date===date;});
  if(complete){
    var dt=new Date(date+'T00:00:00Z'); dt.setUTCDate(dt.getUTCDate()+7);
    COT_ENGINE.inputDate=dt.toISOString().slice(0,10);
  }
  scheduleSave(); updateComputed(); renderCotRegime();
  updateStatus(ccy+' COT saved · '+date,'var(--bullish-strong)');
}

  if(vi){ vi.addEventListener('focus',function(){isTyping=true;}); vi.addEventListener('input',previewRiskLive); vi.addEventListener('blur',function(){isTyping=false;}); }
  if(di){ di.addEventListener('focus',function(){isTyping=true;}); di.addEventListener('change',previewRiskLive); di.addEventListener('blur',function(){isTyping=false;}); }
  if(sb){ sb.addEventListener('click',saveRiskClose); }

  // Risk Sentiment now has an explicit save action and explicit observation date.
  // This prevents a close entered for a completed session from being silently attached
  // to the wrong automatic date.
}

  var statRisk=document.getElementById("statRisk-"+c); if(statRisk){ var riskPtsNow=riskContributionFor(c); statRisk.textContent=(riskPtsNow>0?"+":"")+riskPtsNow.toFixed(1); statRisk.setAttribute("style",numColor(riskPtsNow)); }
  var sf=document.getElementById("statFund-"+c); if(sf){ var f2=fundFor(c); sf.textContent=(f2.raw>0?"+":"")+f2.raw; sf.setAttribute("style",numColor(f2.raw)); }

    alignEl.setAttribute("style", alignColor2+"text-align:right;max-width:190px;font-size:12.5px;font-weight:600;");

  var y2TrendEl=document.getElementById("stat2YTrend-"+c);
  if(y2TrendEl){ y2TrendEl.textContent=y2TrendLabel(y2Now.score); y2TrendEl.className="y2-small "+y2TrendClass(y2Now.score); }
  var seasEl=document.getElementById("seasTxt-"+c);

  var flowEl=document.getElementById("cotFlowTxt-"+c);
  if(flowEl){ flowEl.textContent=cotFlow(c); }

  if(wowEl){ var cd2=cotLatest(c); wowEl.textContent=cotFormat(cd2.netChg); wowEl.style.color = cd2.netChg>0?"var(--bullish-strong)":cd2.netChg<0?"var(--bearish-strong)":"var(--text-dim)"; }
  var lsEl=document.getElementById("cotLongShortTxt-"+c);
  if(lsEl){ var cd3=cotLatest(c); lsEl.textContent=cd3.long==null||cd3.short==null?"—":Math.round(cd3.long).toLocaleString()+" / "+Math.round(cd3.short).toLocaleString(); }

function renderAllStatic(){ document.body.classList.toggle("editing", unlockedLocally); renderOverview(); renderRaw(); renderDetail(); renderPairs(); renderScanner(); renderYield2Y(); renderRiskSentiment(); renderCotRegime(); }
window.addEventListener("resize", function(){ if(document.getElementById("histSpreadCanvas")) histSpreadDraw(); });

async function init(){
  loadAuthFromStorage();

  /* Paint the interface before any network/auth await. A slow or unavailable cloud
     connection must never leave the Overview visually blank. */
  var savedTheme="ash";
  try{ savedTheme = localStorage.getItem('twp_theme_pref') || "ash"; }catch(e){}
  if(savedTheme!=="ash" && savedTheme!=="black") savedTheme="ash";
  applyTheme(savedTheme);

  if(!DATA){
    if(!loadLocalCache()) DATA = seed();
  }
  initMomentum();
  try{ ensureCHFUniverse(); ensureCotEngine(); ensureEconomicCalendarSeed(); }catch(e){ console.warn("Local dashboard bootstrap warning:",e); }
  ensureEconomicCalendarSeed();
  renderLockBox();
  renderAllStatic();
  updateStatus("Local dashboard ready · syncing cloud…", "var(--text-dim)");

  var themeBtns=document.querySelectorAll("#themeSwitch .theme-btn");
  for(var ti=0;ti<themeBtns.length;ti++){ themeBtns[ti].onclick=function(){ applyTheme(this.dataset.theme); }; }
  var tabBtns=document.querySelectorAll(".tab-btn");
  for(var i=0;i<tabBtns.length;i++){ tabBtns[i].onclick=function(){ switchTab(this.dataset.tab); }; }
  
  var msb = document.getElementById("manualSaveBtn");
  if(msb) {
    msb.onclick = async function() {
      var btn=this, orig=btn.textContent;
      btn.disabled=true; btn.textContent="Saving...";
      var ok=await saveDataNow();
      btn.textContent=ok?"Saved!":"Save queued";
      setTimeout(function(){ btn.textContent=orig; btn.disabled=false; },1500);
    };
  }

  if(AUTH.accessToken){
    if(AUTH.expiresAt && AUTH.expiresAt - Date.now() < 5*60*1000){
      try{ await authRefresh(); }catch(e){ console.warn("Auth refresh warning:",e); }
    }
    if(AUTH.accessToken) unlockedLocally=true;
  }
  ensureEconomicCalendarSeed();
  renderLockBox();

  let loaded = false;

  function migrateLegacyYieldFields(){
    if(!DATA) return false;
    var changed=false;
    for(var i=0;i<CCYS.length;i++){
      var c=CCYS[i];
      if(Object.prototype.hasOwnProperty.call(DATA[c],"yield")){ delete DATA[c].yield; changed=true; }
      if(Object.prototype.hasOwnProperty.call(DATA[c],"prevYield")){ delete DATA[c].prevYield; changed=true; }
    }
    return changed;
  }

  // Supabase is the shared source of truth. Load it first so every browser
  // starts from the same dashboard state.
  try {
    const rows = await supabaseRequest(SUPABASE_TABLE + "?id=eq." + SUPABASE_ROW_ID + "&select=id,payload,updated_at", { useAuth: true });
    if (rows && rows.length && rows[0].payload) {
      const parsed = JSON.parse(rows[0].payload);
      if (parsed && parsed.DATA && Object.keys(parsed.DATA).length) {
        DATA = parsed.DATA;
        SETTINGS = parsed.SETTINGS || {passwordHash:null};
        DAILY = parsed.DAILY || {};
        LOG = parsed.LOG || [];
        SIGNAL_LOG = parsed.SIGNAL_LOG || {};
        YIELD_ENGINE = parsed.YIELD_ENGINE || {history:[], current:{}};
        RISK_SENTIMENT = normalizeRiskState(parsed.RISK_SENTIMENT);
        COT_ENGINE = parsed.COT_ENGINE || {history:[],current:{},currentDate:"",inputDate:""};
        ECON_CALENDAR = Array.isArray(parsed.ECON_CALENDAR) ? parsed.ECON_CALENDAR : [];
        CLOUD_UPDATED_AT = rows[0].updated_at || null;
        loaded = true;
      }
    }
  } catch(e) {
    console.error("Supabase load error:", e);
  }

  var pendingRecovered=false;
  if(loaded){
    var cloudUpdatedAt=null;
    try { var cloudMeta=await supabaseRequest(SUPABASE_TABLE+"?id=eq."+SUPABASE_ROW_ID+"&select=updated_at",{useAuth:true}); cloudUpdatedAt=cloudMeta&&cloudMeta[0]?cloudMeta[0].updated_at:null; } catch(e){}
    pendingRecovered=applyPendingCloudStateIfNewer(cloudUpdatedAt);
  } else {
    pendingRecovered=applyPendingCloudStateIfNewer(null);
  }

  // First-time migration: if the shared row is still empty, preserve the
  // existing local dashboard data from this browser and upload it once.
  if (!loaded) {
    if (!pendingRecovered) { if (!loadLocalCache()) DATA = seed(); pendingRecovered=applyPendingCloudStateIfNewer(null); }
    initMomentum();
    try {
      await supabaseRequest(SUPABASE_TABLE + "?id=eq." + SUPABASE_ROW_ID, {
        method: "PATCH",
        useAuth: true,
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify({
          payload: JSON.stringify({DATA:DATA, SETTINGS:SETTINGS, DAILY:DAILY, LOG:LOG, SIGNAL_LOG:SIGNAL_LOG, YIELD_ENGINE:YIELD_ENGINE, RISK_SENTIMENT:RISK_SENTIMENT, COT_ENGINE:COT_ENGINE, ECON_CALENDAR:ECON_CALENDAR}),
          updated_at: new Date().toISOString()
        })
      });
      updateStatus("Cloud initialized", "var(--bullish-strong)");
    } catch(e) {
      console.error("Initial cloud migration failed:", e);
    }
  }

  function cloneObj(x){ return JSON.parse(JSON.stringify(x)); }
  function ensureCHFUniverse(){
    if(!DATA) return false;
    var changed=false;
    var seedState=seed();
    if(!DATA.CHF){ DATA.CHF=cloneObj(seedState.CHF); changed=true; }
    else {
      // Do not overwrite existing user edits. Only repair missing CHF fields/arrays.
      ["growth","inflation","labour"].forEach(function(k){
        if(!Array.isArray(DATA.CHF[k]) || !DATA.CHF[k].length){ DATA.CHF[k]=cloneObj(seedState.CHF[k]); changed=true; }
      });
      ["seasonality","cotNet","cotChangeBias","longPct","shortPct","changePct","interestRate","nextMove","conviction","guidance"].forEach(function(k){
        if(DATA.CHF[k]===undefined || DATA.CHF[k]===null){ DATA.CHF[k]=seedState.CHF[k]; changed=true; }
      });
    }
    if(!YIELD_ENGINE) YIELD_ENGINE={history:[],current:{}};
    if(!Array.isArray(YIELD_ENGINE.history)) YIELD_ENGINE.history=[];
    var by={};
    YIELD_ENGINE.history.forEach(function(r){ if(r && r.date){ by[r.date]=Object.assign({},r); } });
    CHF_YIELD_HISTORY.forEach(function(r){
      var row=by[r.date]||{date:r.date};
      if(row.CHF!==r.CHF){ row.CHF=r.CHF; changed=true; }
      by[r.date]=row;
    });
    YIELD_ENGINE.history=Object.keys(by).sort().map(function(d){return by[d];});
    var latest=YIELD_ENGINE.history.length?YIELD_ENGINE.history[YIELD_ENGINE.history.length-1]:null;
    if(latest){
      if(!YIELD_ENGINE.current) YIELD_ENGINE.current={};
      if(YIELD_ENGINE.current.CHF==null && latest.CHF!=null){ YIELD_ENGINE.current.CHF=latest.CHF; changed=true; }
      if(!YIELD_ENGINE.currentDate) { YIELD_ENGINE.currentDate=latest.date; YIELD_ENGINE.inputDate=latest.date; changed=true; }
    }
    if(!DATA.CHF._chfVersion) { DATA.CHF._chfVersion="2026-08-20"; changed=true; }
    return changed;
  }

  var chfMigrated = ensureCHFUniverse();
  var cotMigrated = ensureCotEngine();
  initMomentum();
  if((chfMigrated || cotMigrated || pendingRecovered) && AUTH.accessToken){ await saveDataNow(); }

  // The one-time fundamental-model migration has already done its job and is
  // permanently retired. It must never run again — it used to reset any
  // manually rebalanced indicator weight back to an old fixed list every time
  // the dashboard polled the cloud, silently undoing real edits. Your current
  // indicator set and weights, whatever you've set them to, are now the
  // permanent source of truth and nothing in this file will overwrite them.

  if(migrateLegacyYieldFields()){
    if(AUTH.accessToken){ await saveDataNow(); }
    else { persistLocalState(JSON.stringify(buildPersistedState())); }
  }

  var removedUnfinishedToday=y2RemoveUnfinishedToday();
  y2SetCurrentFromLatestSaved();
  if(removedUnfinishedToday && AUTH.accessToken){ await saveDataNow(); }

  migrateSeasonalityData();
  renderLockBox();
  renderAllStatic();

  updateStatus("Connecting to cloud...", "var(--text-dim)");
  // Poll for changes so every open dashboard receives the shared state.
  // This avoids requiring any paid realtime service and works on GitHub Pages.
  let lastCloudUpdatedAt = null;
  async function pullCloudState(){
    try {
      const rows = await supabaseRequest(SUPABASE_TABLE + "?id=eq." + SUPABASE_ROW_ID + "&select=id,payload,updated_at", { useAuth: true });
      if (!rows || !rows.length || !rows[0].payload) return;
      const row = rows[0];
      if (lastCloudUpdatedAt === row.updated_at) return;
      // Never replace in-memory edits while a user is typing or while a local
      // save is still in flight/queued. More importantly, a failed cloud save
      // leaves a newer pending local snapshot behind; an older cloud poll must
      // never overwrite that recovery copy during the retry window.
      if (isTyping || isSaving || isSaveQueued) return;
      var pendingDuringPoll = readPendingCloudState();
      if(pendingDuringPoll && pendingDuringPoll.payload){
        try{
          var pendingParsedPoll=JSON.parse(pendingDuringPoll.payload);
          var pendingAtPoll=(pendingParsedPoll&&pendingParsedPoll.DATA&&pendingParsedPoll.DATA._updatedAt)||pendingDuringPoll.queuedAt||null;
          if(pendingAtPoll && row.updated_at && pendingAtPoll>row.updated_at){
            lastCloudUpdatedAt=row.updated_at;
            updateStatus('Local changes queued — waiting for cloud retry', 'var(--amber)');
            return;
          }
        }catch(e){}
      }
      lastCloudUpdatedAt = row.updated_at;
      const parsed = JSON.parse(row.payload);
      if (!parsed || !parsed.DATA) return;
      DATA = parsed.DATA;
      migrateSeasonalityData();
      SETTINGS = parsed.SETTINGS || {passwordHash:null};
      DAILY = parsed.DAILY || {};
      LOG = parsed.LOG || [];
      var preservedInputDate = (YIELD_ENGINE && YIELD_ENGINE.inputDate) ? YIELD_ENGINE.inputDate : '';
      YIELD_ENGINE = parsed.YIELD_ENGINE || {history:[], current:{}};
      if(preservedInputDate) YIELD_ENGINE.inputDate=preservedInputDate;
      RISK_SENTIMENT = normalizeRiskState(parsed.RISK_SENTIMENT);
      COT_ENGINE = parsed.COT_ENGINE || {history:[],current:{},currentDate:"",inputDate:""};
      ECON_CALENDAR = Array.isArray(parsed.ECON_CALENDAR) ? parsed.ECON_CALENDAR : [];
      var removedFuture = y2RemoveUnfinishedToday();
      y2SetCurrentFromLatestSaved();
      if(removedFuture && AUTH.accessToken){
        try { await saveDataNow(); } catch(e) { console.error("Future-close cleanup save failed:", e); }
      }
      persistLocalState(JSON.stringify(buildPersistedState()));
      if (!isTyping) {
        renderAllStatic();
        renderLockBox();
      } else {
        updateComputed();
      }
      updateStatus(removedFuture ? "Future daily closes removed — latest close restored" : "Live synced", removedFuture ? "var(--amber)" : "var(--text-faint)");
    } catch(e) {
      console.error("Cloud sync error:", e);
    }
  }
  pullCloudState();
  setInterval(pullCloudState, 3000);

}

init();
</script>

<script>
(function(){
  var sessions=[
    {key:'Sydney',tz:'Australia/Sydney',open:8,close:17},
    {key:'Tokyo',tz:'Asia/Tokyo',open:9,close:18},
    {key:'London',tz:'Europe/London',open:8,close:17},
    {key:'New York',tz:'America/New_York',open:8,close:17}
  ];
  function parts(date,tz){
    var a=new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(date),o={};
    a.forEach(function(x){o[x.type]=x.value;});
    return {year:+o.year,month:+o.month,day:+o.day,weekday:o.weekday,hour:+o.hour,minute:+o.minute,second:+o.second};
  }
  function offsetAt(date,tz){
    var p=parts(date,tz);
    var asUTC=Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second);
    return asUTC-date.getTime();
  }
  function zoned(y,m,d,h,min,sec,tz){
    var guess=Date.UTC(y,m-1,d,h,min,sec);
    var off=offsetAt(new Date(guess),tz);
    return new Date(guess-off);
  }
  function nextBusinessDate(y,m,d){
    var x=new Date(Date.UTC(y,m-1,d));
    do{x.setUTCDate(x.getUTCDate()+1);}while(x.getUTCDay()===0||x.getUTCDay()===6);
    return {y:x.getUTCFullYear(),m:x.getUTCMonth()+1,d:x.getUTCDate()};
  }
  function sessionState(s,now){
    var p=parts(now,s.tz), dow=nowDay(p);
    if(dow===0||dow===6){
      var nb=nextBusinessDate(p.year,p.month,p.day);
      var nopen=zoned(nb.y,nb.m,nb.d,s.open,0,0,s.tz);
      return {local:pad(p.hour)+':'+pad(p.minute),state:'closed',label:'Opens '+humanDiff(nopen-now),event:nopen};
    }
    var minute=p.hour*60+p.minute+p.second/60, open=s.open*60, close=s.close*60;
    if(minute>=open && minute<close){
      var c=zoned(p.year,p.month,p.day,s.close,0,0,s.tz);
      return {local:pad(p.hour)+':'+pad(p.minute),state:'open',label:'Open · closes '+humanDiff(c-now),event:c};
    }
    if(minute<open){
      var o=zoned(p.year,p.month,p.day,s.open,0,0,s.tz);
      return {local:pad(p.hour)+':'+pad(p.minute),state:'soon',label:'Opens '+humanDiff(o-now),event:o};
    }
    var nb2=nextBusinessDate(p.year,p.month,p.day), o2=zoned(nb2.y,nb2.m,nb2.d,s.open,0,0,s.tz);
    return {local:pad(p.hour)+':'+pad(p.minute),state:'closed',label:'Opens '+humanDiff(o2-now),event:o2};
  }
  function nowDay(p){
    var probe=new Date(Date.UTC(p.year,p.month-1,p.day));
    return probe.getUTCDay();
  }
  function pad(n){return String(n).padStart(2,'0');}
  function humanDiff(ms){
    var total=Math.max(0,Math.floor(ms/1000)), h=Math.floor(total/3600), m=Math.floor((total%3600)/60);
    if(h>=24){var d=Math.floor(h/24);h%=24;return d+'d '+h+'h';}
    if(h>0)return h+'h '+m+'m';
    return m+'m';
  }
  function updateGHClock(){
    var now=new Date(), el=document.getElementById('ghClock'), dateEl=document.getElementById('ghDate');
    if(el){var p=parts(now,'Africa/Accra');el.textContent=pad(p.hour)+':'+pad(p.minute)+':'+pad(p.second);}
    if(dateEl){
      try{ dateEl.textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Accra',weekday:'short',day:'2-digit',month:'short'}).format(now); }
      catch(e){ dateEl.textContent=''; }
    }
    renderSessions(now);
  }
  function renderSessions(now){
    var pop=document.getElementById('sessionPopover'); if(!pop)return;
    var rows=sessions.map(function(s){
      var x=sessionState(s,now);
      return '<div class="session-row"><div class="session-city">'+s.key+'</div><div class="session-local">'+x.local+'</div><div class="session-hours">'+String(s.open).padStart(2,'0')+':00–'+String(s.close).padStart(2,'0')+':00</div><div class="session-state '+x.state+'">'+x.label+'</div></div>';
    }).join('');
    pop.innerHTML='<div class="session-pop-head"><div><div class="session-pop-title">MARKET SESSIONS</div><div class="session-pop-sub">Local time · live countdowns</div></div><div class="session-pop-sub">GH '+new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Accra',hour:'2-digit',minute:'2-digit',hour12:false}).format(now)+'</div></div>'+rows;
  }
  var trig=document.getElementById('sessionTrigger'), pop=document.getElementById('sessionPopover');
  if(trig&&pop){
    trig.addEventListener('click',function(e){e.stopPropagation();var open=pop.hidden;pop.hidden=!open;trig.setAttribute('aria-expanded',String(open));renderSessions(new Date());});
    document.addEventListener('click',function(){if(!pop.hidden){pop.hidden=true;trig.setAttribute('aria-expanded','false');}});
    pop.addEventListener('click',function(e){e.stopPropagation();});
  }
  updateGHClock();setInterval(updateGHClock,1000);
})();
</script>

<style id="v47-overview-fit-viewport">

   with no definite height anywhere above it, the CSI chart's SVG
   (height:100%) had nothing to resolve its percentage against, so the
   browser fell back to inflating it (measured ~434px instead of its
   intended ~230px). That extra height then dragged the whole bottom row,
   and the page, taller than the viewport.

   the percentage heights resolve normally, while keeping every row/element
   min-height from the previous pass intact — so content still can't be

<style id="v67-name-gate-and-greeting">
/* Lightweight "who's watching" gate, requested separately from the Team email/password

#twpNameGate .twp-name-gate-input{width:100%;box-sizing:border-box;background:#0b0d0b;border:1px solid var(--border);color:var(--text);padding:10px 12px;font-size:14px;margin-bottom:12px;font-family:Inter,system-ui,sans-serif;}
#twpNameGate .twp-name-gate-input:focus{outline:none;border-color:var(--bullish);}
#twpNameGate .twp-name-gate-btn{width:100%;background:var(--bullish);color:#06110b;border:none;padding:10px 12px;font-weight:800;font-size:13.5px;letter-spacing:.02em;cursor:pointer;font-family:Inter,system-ui,sans-serif;}
#twpNameGate .twp-name-gate-btn:hover{filter:brightness(1.08);}
/* A real third flex child of .page-head, sitting centered between the title block and the
   GH clock block in that same sticky header bar -- not a separate row, not an overlay. It
   takes flex:1 so it's always exactly centered in the remaining space regardless of how
   wide the title or clock area are. Shown as two stacked lines (greeting, then session
   line) rather than one long horizontal line. */
.twp-greeting-banner{flex:1 1 auto;min-width:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 8px;font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:12px;color:var(--amber);text-align:center;line-height:1.35;}
.twp-greeting-banner .twp-greeting-line1,.twp-greeting-banner .twp-greeting-line2{transition:opacity .3s ease;max-width:100%;}
.twp-greeting-banner .twp-greeting-line1.fade,.twp-greeting-banner .twp-greeting-line2.fade{opacity:0;}

@keyframes twpPulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
@media (max-width:700px){ .twp-greeting-banner{display:none;} } /* header stacks to block layout on mobile -- see .page-head{display:block} above; skip rather than misplace it there */
</style>
<script id="v67-name-gate-and-greeting-js">
// One-time "what's your name" gate + a PERSISTENT, self-updating time-of-day/session
// greeting. Independent of the Team email/password unlock box (that's still for who's
// allowed to EDIT) -- this is just so the dashboard can greet whoever's watching it.
// It's inserted as a real third flex child of .page-head -- the same sticky header bar
// that already holds the page title on the left and the GH clock on the right -- sitting
// centered in the space between them, shown as two stacked lines. Because it's flex:1 in
// normal layout (not an overlay), it can never cover the tabs, tables, or anything else on
// screen.
// Uses the same Africa/Accra clock (= UTC, so it doubles as the FX session clock) that the
// header's GH time already runs on. The name is stored in localStorage so it only asks
// once per browser, not on every refresh. It re-renders on an interval so its wording
// always matches the current hour/session, and swaps to a fresh line periodically so it
// doesn't feel static while it sits there.
function twpAccraHour(){
  try{
    var fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Accra',hour:'2-digit',hour12:false});
    return parseInt(fmt.format(new Date()),10);
  }catch(e){ return new Date().getHours(); }
}
function twpDayBucket(hour){
  return (hour>=5&&hour<12)?'morning':(hour>=12&&hour<17)?'afternoon':(hour>=17&&hour<21)?'evening':'night';
}
// Accra local time == UTC, so these hour ranges double directly as standard FX session hours.
function twpSessionTag(hour){
  var sydney=(hour>=21||hour<6), tokyo=(hour>=0&&hour<9), london=(hour>=7&&hour<16), ny=(hour>=12&&hour<21);
  if(london&&ny) return 'the London/New York overlap';
  if(tokyo&&london) return 'the Tokyo/London overlap';
  if(sydney&&tokyo) return 'the Sydney/Tokyo overlap';
  if(ny) return 'New York session';
  if(london) return 'London session';
  if(tokyo) return 'Tokyo session';
  if(sydney) return 'Sydney session';
  return 'the lull between sessions';
}
function twpGreetingPrefix(bucket,name){
  var pools={
    morning:['Good morning, '+name,'Morning, '+name,'Rise and grind, '+name],
    afternoon:['Good afternoon, '+name,'Afternoon, '+name,"What's up, "+name],
    evening:['Good evening, '+name,'Evening, '+name,"What's up, "+name],
    night:["It's late, "+name,'Still up, '+name+'?','Burning the midnight oil, '+name+'?']
  };
  var list=pools[bucket];
  return list[Math.floor(Math.random()*list.length)];
}
function twpSessionLine(session){
  var lines=[
    "It's "+session+" — any trade on your radar?",
    "We're in "+session+" right now.",
    session.charAt(0).toUpperCase()+session.slice(1)+" is live — worth a scan of the dashboard.",
    "Currently "+session+". Anything you're watching?"
  ];
  return lines[Math.floor(Math.random()*lines.length)];
}
// Markets are shut Sat/Sun, so "It's London session" reads as a bug on a weekend --
// nothing is actually trading. Accra local time == UTC (no DST), so the UTC day-of-week
// doubles directly as the Ghana-time day-of-week, same trick the hour buckets above rely on.
function twpIsWeekend(){
  var d=new Date().getUTCDay();
  return d===0||d===6;
}
function twpWeekendLine(){
  var lines=[
    "How's your weekend going?",
    "Any premarket analysis for Monday yet?",
    "Markets are shut for the weekend — caught up on the news?",
    "Good time to review the week's charts before Monday.",
    "Weekend prep: got your levels marked up for the open?"
  ];
  return lines[Math.floor(Math.random()*lines.length)];
}
// Returns the two lines separately now, instead of one joined string, so they render as
// two stacked lines: line1 is the time-of-day greeting, line2 is the session comment
// Monday-Friday, or a weekend-appropriate line on Saturday/Sunday (no session exists then).
function twpBuildGreeting(name){
  var hour=twpAccraHour();
  var line1=twpGreetingPrefix(twpDayBucket(hour),name);
  var line2=twpIsWeekend() ? twpWeekendLine() : twpSessionLine(twpSessionTag(hour));
  return {line1:line1,line2:line2};
}
var twpGreetingName=null, twpGreetingState={hour:null};
function twpRenderGreeting(force){
  var el=document.getElementById('twpGreetingBanner');
  if(!el||!twpGreetingName) return;
  var hour=twpAccraHour();
  if(!force && hour===twpGreetingState.hour && Math.random()<0.5) return; // keep some variety even within the same hour
  twpGreetingState.hour=hour;
  var l1=el.querySelector('.twp-greeting-line1'), l2=el.querySelector('.twp-greeting-line2');
  var next=twpBuildGreeting(twpGreetingName);
  l1.classList.add('fade'); l2.classList.add('fade');
  setTimeout(function(){
    l1.textContent=next.line1;
    l2.textContent=next.line2;
    l1.classList.remove('fade'); l2.classList.remove('fade');
  },300);
}
function twpShowGreetingPanel(name){
  twpGreetingName=name;
  if(document.getElementById('twpGreetingBanner')) return;
  try{ if(sessionStorage.getItem('twp_greeting_hidden')==='1') return; }catch(e){}
  var pageHead=document.querySelector('.page-head');
  if(!pageHead||pageHead.children.length<2) return; // fail quietly if that header's markup ever changes shape
  var el=document.createElement('div');
  el.id='twpGreetingBanner';
  el.className='twp-greeting-banner';
  el.innerHTML='<div class="twp-greeting-line1"><span class="twp-greeting-dot"></span></div><div class="twp-greeting-line2"></div>';
  pageHead.insertBefore(el,pageHead.children[1]); // between the title block (child 0) and the Ready/GH clock block (was child 1)
  var msg=twpBuildGreeting(name);
  var l1=el.querySelector('.twp-greeting-line1'), l2=el.querySelector('.twp-greeting-line2');
  l1.appendChild(document.createTextNode(msg.line1));
  l2.textContent=msg.line2;
}
function twpShowNameGateIfNeeded(){
  var name=null;
  try{ name=localStorage.getItem('twp_visitor_name'); }catch(e){}
  if(name){ twpShowGreetingPanel(name); }
  else{
    var overlay=document.createElement('div');
    overlay.id='twpNameGate';
    overlay.innerHTML='<div class="twp-name-gate-card">'+
      '<div class="twp-name-gate-brand">TWP</div>'+
      '<div class="twp-name-gate-title">Welcome</div>'+
      '<div class="twp-name-gate-sub">What should we call you?</div>'+
      '<input id="twpNameGateInput" class="twp-name-gate-input" type="text" maxlength="24" placeholder="Your name" autocomplete="off"/>'+
      '<button id="twpNameGateBtn" type="button" class="twp-name-gate-btn">Continue</button>'+
    '</div>';
    document.body.appendChild(overlay);
    var input=document.getElementById('twpNameGateInput'), btn=document.getElementById('twpNameGateBtn');
    if(input) input.focus();
    function submit(){
      var v=(input.value||'').trim().slice(0,24);
      if(!v){ input.focus(); return; }
      try{ localStorage.setItem('twp_visitor_name',v); }catch(e){}
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      twpShowGreetingPanel(v);
    }
    if(btn) btn.onclick=submit;
    if(input) input.addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  }
  // Keep the panel live: re-check every 60s so it always reflects the current hour/session,
  // and refresh its wording every ~4 minutes so it doesn't sit static while it stays on screen.
  setInterval(function(){ twpRenderGreeting(false); },60000);
  setInterval(function(){ twpRenderGreeting(true); },240000);
}
twpShowNameGateIfNeeded();
</script>
<style id="v68-scanner-sticky-header-seam-fix">
/* Requested: scrolling down the Trade Scanner table (e.g. after filtering to short-side
   setups) showed a thin sliver of gap right at the sticky header's edge, with whatever had
   scrolled past underneath faintly bleeding through it. Root cause: this table combines a
   vertically-sticky header row with horizontally-sticky frozen columns on top of
   border-collapse:collapse -- that specific combination has a well-known rendering bug in
   Chromium browsers where the collapsed borders don't repaint cleanly under a sticky cell,
   leaving a hairline gap along the header's edge during scroll. Switching to
   border-collapse:separate with zero spacing keeps every visual border (each cell already
   carries its own border-bottom) but paints per-cell instead of as one shared/collapsed grid
   line, which is what a sticky position needs to render solid with no seam. */
#tab-scanner table.scanner-table{border-collapse:separate!important;border-spacing:0!important;}
</style>
<style id="v69-scanner-sticky-header-solid-slab">
/* The v68 fix (border-collapse:separate) helped, but the real gap has the same root cause
   that Pair Ranking already hit and fixed for good in "pair-ranking-sticky-v4-solid-strip"
   above: sticking each <th> individually (this table's original approach) leaves the header
   built out of several separately-positioned pieces, and a scrolling row can peek through
   the seams between them for a frame or two. Pair Ranking's fix was to stop sticking the
   individual cells for the vertical axis and instead stick the whole <thead> as ONE opaque
   slab, with a covering pseudo-element sized slightly larger than the slab itself so there's
   no fractional-pixel edge left uncovered. Porting that same pattern here.
   The frozen left columns (Idea/Pair/Score/7D) are a second, independent axis -- those still
   need their own position:sticky (for LEFT, when scrolling right), which is untouched below. */
#tab-scanner .scanner-table thead{
  position:sticky!important;top:var(--twp-header-offset,56px)!important;z-index:70!important;
  background:var(--panel2)!important;isolation:isolate!important;margin-top:-1px!important;
}
#tab-scanner .scanner-table thead:before{
  content:"";position:absolute;left:-2px;right:-2px;top:-2px;bottom:-2px;
  background:var(--panel2);z-index:-1;
  box-shadow:0 1px 0 var(--border),0 4px 10px rgba(0,0,0,.16);
  pointer-events:none;
}
#tab-scanner .scanner-table thead tr{position:static!important;background:transparent!important;}
#tab-scanner .scanner-table th{position:static!important;box-shadow:none!important;}
/* Frozen left columns keep their own sticky (horizontal-only) positioning -- independent
   of the vertical slab above, and still required for the scroll-right freeze to work. */
#tab-scanner .scanner-table th:nth-child(2),#tab-scanner .scanner-table th:nth-child(3),
#tab-scanner .scanner-table th:nth-child(4),#tab-scanner .scanner-table th:nth-child(5){
  position:sticky!important;z-index:8!important;background:var(--panel2)!important;
}
</style>
